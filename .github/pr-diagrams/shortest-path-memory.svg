<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Shortest path record memory flow</title>
  <desc id="desc">Sparse identifiers cause large fixed-address allocations before the patch; hash-backed records scale with visited keys after the patch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="300" rx="16" fill="#f8fafc"/>
  <text x="32" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#172b4d">Shortest path records</text>
  <rect x="32" y="70" width="160" height="62" rx="12" fill="#dbeafe" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="112" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1e3a8a">Sparse IDs</text>
  <text x="112" y="119" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">string / wide keys</text>
  <path d="M192 101 H250" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="250" y="70" width="170" height="62" rx="12" fill="#e0e7ff" stroke="#818cf8" filter="url(#shadow)"/>
  <text x="335" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3730a3">ID encoding</text>
  <text x="335" y="119" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3730a3">sparse integer keys</text>
  <path d="M420 101 H490" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="52" width="190" height="78" rx="12" fill="#fee2e2" stroke="#ef4444" filter="url(#shadow)"/>
  <text x="585" y="83" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#991b1b">Fixed address</text>
  <text x="585" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">large segment arrays</text>
  <path d="M680 91 H754" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="754" y="52" width="174" height="78" rx="12" fill="#fecaca" stroke="#dc2626" filter="url(#shadow)"/>
  <text x="841" y="83" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#991b1b">Heap pressure</text>
  <text x="841" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">amplified allocation</text>
  <path d="M420 111 V216 H490" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="178" width="190" height="78" rx="12" fill="#dcfce7" stroke="#22c55e" filter="url(#shadow)"/>
  <text x="585" y="209" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#166534">Hash-backed</text>
  <text x="585" y="231" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">record entries</text>
  <path d="M680 217 H754" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="754" y="178" width="174" height="78" rx="12" fill="#bbf7d0" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="841" y="209" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#166534">Bounded growth</text>
  <text x="841" y="231" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">visited-key scale</text>
</svg>
