name: "Server Memory CI"

on:
  push:
    branches:
      - master
      - 'release-*'
      - 'test-*'
  pull_request:
  workflow_dispatch:

# Keep the newest PR run; preserve independent push, release and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt == 1 && 'head' || format('rerun-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.select.outputs.server }}
      commons: ${{ steps.select.outputs.commons }}
      pd_store: ${{ steps.select.outputs.pd_store }}
      cluster: ${{ steps.select.outputs.cluster }}
      docker: ${{ steps.select.outputs.docker }}
      helm: ${{ steps.select.outputs.helm }}
      dependency_license: ${{ steps.select.outputs.dependency_license }}
      compatibility: ${{ steps.select.outputs.compatibility }}
      smoke: ${{ steps.select.outputs.smoke }}
      security: ${{ steps.select.outputs.security }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected tests
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/ci-policy.py plan --project server
          --event-path "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
          --output plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: plan.json
          retention-days: 7
          overwrite: true

  java-runtime:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    uses: ./.github/workflows/java-runtime.yml
    permissions:
      contents: read

  build-server:
    needs: [plan, java-runtime]
    if: needs.plan.outputs.server == 'true'
    uses: ./.github/workflows/server-tests.yml
    with:
      backend: memory
      java-versions: ${{ needs.java-runtime.outputs.versions }}
    secrets: inherit

  server-memory-required:
    name: Server memory tests
    needs: [plan, java-runtime, build-server]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check planning and runtime results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          if results['plan']['result'] != 'success':
              raise SystemExit('CI planning failed')
          if results['plan']['outputs'].get('server') == 'true' and results['java-runtime']['result'] != 'success':
              raise SystemExit('Selected Java runtime preparation failed')
          results['server_memory'] = results['build-server']
          with open('results.json', 'w') as output:
              json.dump(results, output)
          PYGATE
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - name: Report selected suites and their real results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-policy.py gate --mode memory --plan plan.json --results results.json --output test-results.json

  legacy-server-memory-required:
    name: build-server (memory, 11)
    needs: server-memory-required
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          MEMORY_RESULT: ${{ needs.server-memory-required.result }}
        run: test "$MEMORY_RESULT" = success
