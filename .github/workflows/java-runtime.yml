name: CI Java runtime

on:
  workflow_call:
    inputs:
      extra-java-versions:
        description: Additional JDKs to test alongside the configured project runtime (JSON array).
        type: string
        default: '[]'
    outputs:
      versions:
        description: Project runtime followed by any additional test JDKs (JSON array).
        value: ${{ jobs.read-version.outputs.versions }}

permissions:
  contents: read

jobs:
  read-version:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.java.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the project runtime and optional test JDKs
        id: java
        env:
          EXTRA_JAVA_VERSIONS: ${{ inputs.extra-java-versions }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          runtime = Path('.github/workflows/.java-version').read_text().strip()
          extra = json.loads(os.environ['EXTRA_JAVA_VERSIONS'])
          if not isinstance(extra, list):
              raise ValueError('extra-java-versions must be a JSON array')
          versions = []
          for version in [runtime, *extra]:
              if not isinstance(version, str) or not re.fullmatch(r'[1-9][0-9]*(\.[0-9]+)*', version):
                  raise ValueError('Java versions must be non-empty numeric strings')
              if version not in versions:
                  versions.append(version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('versions=' + json.dumps(versions), file=output)
          PYTHON
