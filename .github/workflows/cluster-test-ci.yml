name: "Cluster Test CI"

on:
  push:
    branches:
      - master
      - 'release-*'
      - 'test-*'
  pull_request:
    # Keep source/resources and shared build inputs; skip named documentation files.
    paths:
      - '.github/workflows/.java-version'
      - 'pom.xml'
      - '.mvn/**'
      - 'style/**'
      - '.editorconfig'
      - '.github/configs/**'
      - 'hugegraph-commons/**'
      - 'hugegraph-struct/**'
      - 'hugegraph-pd/**'
      - 'hugegraph-store/**'
      - 'hugegraph-server/**'
      - 'hugegraph-cluster-test/**'
      - 'install-dist/**'
      - '.github/workflows/cluster-test-ci.yml'
      - '!**/README*'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'

jobs:
  cluster-test:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'false' # Whether to include the stage repository.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: Install project JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: 'zulu'
          cache: maven
          cache-jdk: false

      - name: use staged maven repo settings
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp $HOME/.m2/settings.xml /tmp/settings.xml
          mv -vf .github/configs/settings.xml $HOME/.m2/settings.xml

      - name: Package
        run: |
          mvn clean package -U -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -ntp

      - name: Run simple cluster test
        run: |
          mvn test -pl hugegraph-cluster-test/hugegraph-clustertest-test -am -P simple-cluster-test

      - name: Run multi cluster test
        run: |
          mvn test -pl hugegraph-cluster-test/hugegraph-clustertest-test -am -P multi-cluster-test
