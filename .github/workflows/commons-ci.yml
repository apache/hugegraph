name: "HugeGraph-Commons CI"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-runtime:
    uses: ./.github/workflows/java-runtime.yml
    permissions:
      contents: read

  build-commons:
    name: Commons tests (Java ${{ matrix.JAVA_VERSION }})
    needs: java-runtime
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'false' # Whether to include the stage repository.

    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: ${{ fromJSON(needs.java-runtime.outputs.versions || '["unavailable"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install JDK ${{ matrix.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'zulu'
          cache: maven
          cache-jdk: false

      - name: Use staged maven repo settings
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp $HOME/.m2/settings.xml /tmp/settings.xml
          cp -vf .github/configs/settings.xml $HOME/.m2/settings.xml && cat $HOME/.m2/settings.xml

      - name: Install
        run: |
          mvn install -Dmaven.javadoc.skip=true -ntp -Dmaven.test.skip=true

      - name: Run common test
        run: |
          mvn test -pl hugegraph-commons/hugegraph-common -Dtest=UnitTestSuite \
            -DskipCommonsTests=false -Dsurefire.failIfNoSpecifiedTests=true

      - name: Verify REST request encoding with a non-UTF-8 JVM
        env:
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=US-ASCII -Dhugegraph.test.expectedCharset=US-ASCII'
        run: |
          mvn test -pl hugegraph-commons/hugegraph-common -Dtest=AbstractRestClientTest \
            -DskipCommonsTests=false -Dsurefire.failIfNoSpecifiedTests=true

      - name: Run rpc test
        run: |
          mvn test -pl hugegraph-commons/hugegraph-rpc -Dtest=UnitTestSuite \
            -DskipCommonsTests=false -Dsurefire.failIfNoSpecifiedTests=true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: hugegraph-commons/target/jacoco.xml
          disable_search: true
          fail_ci_if_error: false

  # Temporary compatibility check; Commons becomes optional when .asf.yaml takes effect.
  legacy-commons-required:
    name: build-commons (11)
    needs: [ java-runtime, build-commons ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the runtime configuration and all Commons tests to pass
        env:
          RUNTIME_RESULT: ${{ needs.java-runtime.result }}
          COMMONS_RESULT: ${{ needs.build-commons.result }}
        run: |
          if [ "$RUNTIME_RESULT" != "success" ] || [ "$COMMONS_RESULT" != "success" ]; then
            echo "::error::Runtime configuration: $RUNTIME_RESULT; Commons tests: $COMMONS_RESULT"
            exit 1
          fi
