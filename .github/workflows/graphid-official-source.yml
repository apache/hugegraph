name: GraphID official source fixture
on:
  pull_request:
    paths:
      - 'hugegraph-store/hg-store-test/src/test/graphid-rekey/official-17-source.py'
      - '.github/workflows/graphid-official-source.yml'
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '11'
      - name: Generate stopped official 1.7 source in isolated directories
        shell: bash
        run: |
          set -euo pipefail
          python3 -u hugegraph-store/hg-store-test/src/test/graphid-rekey/official-17-source.py \
            "$RUNNER_TEMP/official-17-source"
      - name: Preserve fixture state and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphid-official-source-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/official-17-source/evidence/
