name: "HugeGraph-Server CI"

on:
  push:
    branches:
      - master
      - 'release-*'
      - 'test-*'
  pull_request:

jobs:
  server-rocksdb-runtime:
    name: server-rocksdb-runtime (${{ matrix.check_name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            provider: rocksdb
            check_name: rocksdb
            experimental: false
          - os: ubuntu-24.04
            provider: topling
            check_name: topling
            experimental: false
          - os: ubuntu-26.04
            provider: topling
            check_name: topling, ubuntu-26.04
            experimental: true
    env:
      TRAVIS_DIR: hugegraph-server/hugegraph-dist/src/assembly/travis
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Use staged maven repo settings
        run: |
          mkdir -p "$HOME/.m2"
          cp -vf .github/configs/settings.xml "$HOME/.m2/settings.xml"

      - name: Package Server
        run: |
          mvn clean package -pl hugegraph-server/hugegraph-dist -am \
              -Dmaven.test.skip=true -ntp

      - name: Select ${{ matrix.provider }} distribution
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SERVER_DIR="hugegraph-server/apache-hugegraph-server-$VERSION"
          if [ "${{ matrix.provider }}" = "topling" ]; then
            touch "$SERVER_DIR/bin/pid"
            mkdir -p "$SERVER_DIR/logs"
            touch "$SERVER_DIR/logs/topling-ci-marker"
            install-dist/scripts/build-topling-distribution.sh server "$VERSION"
            SERVER_DIR="$SERVER_DIR-topling"
          else
            GRAPH_CONF="$SERVER_DIR/conf/graphs/hugegraph.properties"
            sed -i '/^[#]*rocksdb\.provider=/d' "$GRAPH_CONF"
            echo "rocksdb.provider=rocksdb" >> "$GRAPH_CONF"
          fi
          echo "STANDARD_SERVER_DIR=hugegraph-server/apache-hugegraph-server-$VERSION" \
            >> "$GITHUB_ENV"
          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"

      - name: Verify clean ToplingDB distribution
        if: matrix.provider == 'topling'
        env:
          TOPLING_EXPECT_DIRTY_STANDARD: 'true'
        run: |
          "$TRAVIS_DIR/test-topling-distribution.sh" \
            server "$STANDARD_SERVER_DIR" "$SERVER_DIR"

      - name: Test standard RocksDB runtime
        if: matrix.provider == 'rocksdb'
        run: |
          source "$SERVER_DIR/bin/preload-topling.sh"
          "$TRAVIS_DIR/test-rocksdb-runtime.sh" \
              rocksdb "$SERVER_DIR"

      - name: Run Topling native lifecycle diagnostic
        id: topling-native-diagnostic
        if: matrix.provider == 'topling'
        continue-on-error: true
        run: |
          source "$SERVER_DIR/bin/preload-topling.sh"
          "$TRAVIS_DIR/test-rocksdb-runtime.sh" \
              topling "$SERVER_DIR"

      - name: Report Topling native lifecycle diagnostic
        if: >-
          matrix.provider == 'topling' &&
          steps.topling-native-diagnostic.outcome == 'failure'
        run: |
          {
            echo "### Topling native lifecycle diagnostic"
            echo
            echo "The synthetic CF lifecycle reproducer hit the known native"
            echo "assertion tracked by hugegraph/hugegraph#212."
            echo "Image-backed service lifecycle tests remain required."
          } >> "$GITHUB_STEP_SUMMARY"

  topling-runtime-shell-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test strict component-local runtime selection
        run: |
          hugegraph-server/hugegraph-dist/src/assembly/travis/test-topling-runtime-selection.sh
          hugegraph-server/hugegraph-dist/src/assembly/travis/test-topling-docker-entrypoints.sh

  wait-storage-shell-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run wait-storage.sh peer failover tests
        run: hugegraph-server/hugegraph-dist/src/assembly/travis/test-wait-storage.sh

  build-server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-server/hugegraph-dist/src/assembly/travis
      REPORT_DIR: target/site/jacoco
      BACKEND: ${{ matrix.BACKEND }}
      TRIGGER_BRANCH_NAME: ${{ github.ref_name }}
      HEAD_BRANCH_NAME: ${{ github.head_ref }}
      BASE_BRANCH_NAME: ${{ github.base_ref }}
      TARGET_BRANCH_NAME: ${{ github.base_ref != '' && github.base_ref || github.ref_name }}
      RELEASE_BRANCH: ${{ startsWith(github.ref_name, 'release-') || startsWith(github.ref_name, 'test-') }}
      RAFT_MODE: ${{ startsWith(github.head_ref, 'test') || startsWith(github.head_ref, 'raft') }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    strategy:
      fail-fast: false
      matrix:
        BACKEND: [ memory, rocksdb, hbase ]
        JAVA_VERSION: [ '11' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      # TODO: Remove this step after install-backend.sh updated
      - name: Install Java8 for backend
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Install Java ${{ matrix.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Install deps
        run: |
          ${TRAVIS_DIR}/install-deps.sh

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Use staged maven repo settings
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp $HOME/.m2/settings.xml /tmp/settings.xml
          cp -vf .github/configs/settings.xml $HOME/.m2/settings.xml && cat $HOME/.m2/settings.xml

      - name: Package
        run: |
          mvn clean package -Dmaven.test.skip=true -ntp
          source "$TRAVIS_DIR/install-rocksdb.sh" server

      - name: Prepare backend environment
        run: |
          $TRAVIS_DIR/install-backend.sh $BACKEND && jps -l

      - name: Validate Docker integration
        if: ${{ env.BACKEND == 'rocksdb' }}
        run: |
          bash hugegraph-server/hugegraph-dist/docker/docker-entrypoint-test.sh
          bash docker/test-compose.sh render

      - name: Run Compose auth-on smoke tests
        if: ${{ env.BACKEND == 'rocksdb' }}
        run: bash docker/test-compose.sh smoke

      - name: Run check_port unit tests
        if: ${{ env.BACKEND == 'rocksdb' }}
        run: |
          # Validates the ss/netstat port preflight that replaced lsof
          $TRAVIS_DIR/test-check-port.sh \
            hugegraph-server/hugegraph-dist/src/assembly/static \
            hugegraph-store/hg-store-dist/src/assembly/static/bin/util.sh

      - name: Run Java security properties tests
        if: ${{ env.BACKEND == 'rocksdb' }}
        run: |
          mvn package -Dmaven.test.skip=true -pl hugegraph-server/hugegraph-dist -am -ntp
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SERVER_DIR=hugegraph-server/apache-hugegraph-server-$VERSION/
          $TRAVIS_DIR/test-java-security-properties.sh $SERVER_DIR

      - name: Check startup test prerequisites
        id: server-preflight
        if: ${{ env.BACKEND == 'rocksdb' }}
        run: |
          # Note: lsof removed from prerequisites; check_port now uses ss, falling back
          # to netstat, and warns without blocking when neither can answer.
          # This job always runs on Linux (ubuntu-24.04), which uses fuser for port cleanup.
          for tool in crontab curl java; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "can_run=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=missing tool: $tool" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if ! command -v fuser >/dev/null 2>&1; then
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=missing tool: fuser (required for Linux port cleanup)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Run start-hugegraph.sh foreground mode tests
        if: ${{ env.BACKEND == 'rocksdb' && steps.server-preflight.outputs.can_run == 'true' }}
        run: |
          mvn package -Dmaven.test.skip=true -pl hugegraph-server/hugegraph-dist -am -ntp
          source "$TRAVIS_DIR/install-rocksdb.sh" server
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SERVER_DIR=hugegraph-server/apache-hugegraph-server-$VERSION/
          $TRAVIS_DIR/test-start-hugegraph.sh $SERVER_DIR

      - name: Startup tests skipped (missing prerequisites)
        if: ${{ env.BACKEND == 'rocksdb' && steps.server-preflight.outputs.can_run == 'false' }}
        run: |
          echo "::notice::Server startup tests skipped — ${{ steps.server-preflight.outputs.skip_reason }}"

      - name: Run unit test
        run: |
          $TRAVIS_DIR/run-unit-test.sh $BACKEND

      - name: Run core test
        run: |
          $TRAVIS_DIR/run-core-test.sh $BACKEND

      - name: Run api test
        run: |
          if [ "$BACKEND" = "rocksdb" ]; then
            $TRAVIS_DIR/run-api-test.sh $BACKEND $REPORT_DIR true
          else
            $TRAVIS_DIR/run-api-test.sh $BACKEND $REPORT_DIR
          fi

      # TODO: disable raft test in normal PR due to the always timeout problem
      - name: Run raft test
        if: ${{ env.RAFT_MODE == 'true' && env.BACKEND == 'rocksdb' }}
        run: |
          $TRAVIS_DIR/run-api-test-for-raft.sh $BACKEND $REPORT_DIR

      - name: Run TinkerPop test
        if: ${{ env.RELEASE_BRANCH == 'true' }}
        run: |
          echo "[WARNING] Enter Tinkerpop Test, current 'github.ref_name' is ${{ github.ref_name }}"
          $TRAVIS_DIR/run-tinkerpop-test.sh $BACKEND tinkerpop

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.REPORT_DIR }}/*.xml
          disable_search: true
          fail_ci_if_error: false

  build-server-macos-rocksdb:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            server_java_options: ''
          - os: macos-15
            server_java_options: '-Xms512m -Xmx2g'
    env:
      USE_STAGE: 'false' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-server/hugegraph-dist/src/assembly/travis
      REPORT_DIR: target/site/jacoco
      BACKEND: rocksdb
      JAVA_VERSION: '11'
      SERVER_JAVA_OPTIONS: ${{ matrix.server_java_options }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Install Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Use staged maven repo settings
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp $HOME/.m2/settings.xml /tmp/settings.xml
          cp -vf .github/configs/settings.xml $HOME/.m2/settings.xml && cat $HOME/.m2/settings.xml

      - name: Compile
        run: |
          mvn clean compile -pl hugegraph-server/hugegraph-test -am -U -Dmaven.javadoc.skip=true -ntp

      - name: Run check_port unit tests
        # Validates the ss/netstat port preflight that replaced lsof
        run: |
          $TRAVIS_DIR/test-check-port.sh \
            hugegraph-server/hugegraph-dist/src/assembly/static \
            hugegraph-store/hg-store-dist/src/assembly/static/bin/util.sh

      - name: Run RocksDB core test
        run: |
          $TRAVIS_DIR/run-core-test.sh $BACKEND

      - name: Run RocksDB API test
        run: |
          $TRAVIS_DIR/run-api-test.sh $BACKEND $REPORT_DIR true

      - name: Show server log on failure
        if: failure()
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SERVER_DIR=hugegraph-server/apache-hugegraph-server-$VERSION/
          if [ -f "$SERVER_DIR/logs/hugegraph-server.log" ]; then
            tail -n 200 "$SERVER_DIR/logs/hugegraph-server.log"
          fi

      - name: Stop RocksDB server
        if: always()
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SERVER_DIR=hugegraph-server/apache-hugegraph-server-$VERSION/
          if [ -f "$SERVER_DIR/bin/pid" ]; then
            $TRAVIS_DIR/stop-server.sh $SERVER_DIR || true
          fi

  build-server-riscv64:
    uses: ./.github/workflows/riscv64-ci.yml
    permissions:
      contents: read
