name: GraphID rekey experiment
on:
  pull_request:
    paths:
      - 'hugegraph-store/hg-store-core/src/main/java/org/apache/hugegraph/store/upgrade/GraphIdMigrationPlan.java'
      - 'hugegraph-store/hg-store-core/src/main/java/org/apache/hugegraph/store/upgrade/GraphIdRewriter.java'
      - 'hugegraph-store/hg-store-test/src/test/graphid-rekey/**'
      - '.github/workflows/graphid-rekey-experiment.yml'
permissions:
  contents: read
jobs:
  native-rekey:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Run bounded native database experiments
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/graphid-rekey"
          mkdir -p "$WORK/classes" "$WORK/deps"
          exec > >(tee "$WORK/run.log") 2>&1
          git rev-parse HEAD | tee "$WORK/source-sha.txt"
          java -version
          cat > "$WORK/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.apache.hugegraph</groupId><artifactId>graphid-rekey-probe</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>org.rocksdb</groupId><artifactId>rocksdbjni</artifactId><version>8.10.2</version></dependency>
              <dependency><groupId>com.google.protobuf</groupId><artifactId>protobuf-java</artifactId><version>3.22.3</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -B -ntp -f "$WORK/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DoutputDirectory="$WORK/deps"
          sha256sum "$WORK"/deps/*.jar | tee "$WORK/dependencies.sha256"
          CORE=hugegraph-store/hg-store-core/src/main/java/org/apache/hugegraph/store/upgrade
          TEST=hugegraph-store/hg-store-test/src/test/graphid-rekey
          javac --release 17 -cp "$WORK/deps/*" -d "$WORK/classes" \
            "$CORE/GraphIdMigrationPlan.java" "$CORE/GraphIdRewriter.java" "$TEST"/*.java
          java -Xmx512m -cp "$WORK/classes:$WORK/deps/*" org.apache.hugegraph.store.upgrade.GraphIdMigrationPlanProbe
          timeout 180 java -Xmx512m -cp "$WORK/classes:$WORK/deps/*" org.apache.hugegraph.store.upgrade.GraphIdRewriterProbe "$WORK/cases"
      - name: Retain exact-head evidence and native dependencies
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphid-rekey-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/graphid-rekey/run.log
            ${{ runner.temp }}/graphid-rekey/source-sha.txt
            ${{ runner.temp }}/graphid-rekey/dependencies.sha256
            ${{ runner.temp }}/graphid-rekey/deps/
            ${{ runner.temp }}/graphid-rekey/cases/
