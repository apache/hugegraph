name: RocksDB version compatibility
description: Compare exact before/after RocksDB versions on an existing distributed CI runner
runs:
  using: composite
  steps:
    - name: Require exact comparison revisions
      id: revisions
      shell: bash
      env:
        BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        AFTER_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE_SHA" == 0000000000000000000000000000000000000000 &&
              "$AFTER_SHA" =~ ^[0-9a-f]{40}$ && ! "$AFTER_SHA" =~ ^0+$ ]]; then
          echo "::notice::Skipping RocksDB comparison for a newly created ref with no before revision"
          echo "compare=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        for revision in "$BEFORE_SHA" "$AFTER_SHA"; do
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ || "$revision" =~ ^0+$ ]]; then
            echo "Error: cannot determine the before/after revision for RocksDB compatibility" >&2
            exit 1
          fi
        done
        echo "compare=true" >> "$GITHUB_OUTPUT"

    - name: Checkout before
      if: steps.revisions.outputs.compare == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        path: .ci-rocksdb/before
        persist-credentials: false

    - name: Checkout after
      if: steps.revisions.outputs.compare == 'true'
      uses: actions/checkout@v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        path: .ci-rocksdb/after
        persist-credentials: false

    - name: Install comparison JDK
      if: steps.revisions.outputs.compare == 'true'
      uses: actions/setup-java@v6
      with:
        java-version-file: .ci-rocksdb/after/.github/workflows/.java-version
        distribution: 'zulu'

    - name: Test only changed RocksDB version pairs
      if: steps.revisions.outputs.compare == 'true'
      shell: bash
      run: |
        bash .ci-rocksdb/after/hugegraph-server/hugegraph-test/src/test/rocksdb-compatibility/run.sh \
          "$GITHUB_WORKSPACE/.ci-rocksdb/before" "$GITHUB_WORKSPACE/.ci-rocksdb/after" \
          "$RUNNER_TEMP/rocksdb-compatibility"

    - name: Preserve comparison and synthetic-data failure evidence
      if: always() && steps.revisions.outputs.compare == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: rocksdb-compatibility-${{ github.sha }}
        path: |
          ${{ runner.temp }}/rocksdb-compatibility/run.log
          ${{ runner.temp }}/rocksdb-compatibility/models/
          ${{ runner.temp }}/rocksdb-compatibility/pairs.tsv
          ${{ runner.temp }}/rocksdb-compatibility/cases/
