pdserver:
  # PD service address, multiple PD addresses separated by commas
  address: localhost:8686

management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

grpc:
  # grpc service address
  host: 127.0.0.1
  port: 8500
  netty-server:
    max-inbound-message-size: 1000MB
raft:
  # raft cache queue size
  disruptorBufferSize: 1024
  address: 127.0.0.1:8510
  max-log-file-size: 600000000000
  # Snapshot generation interval, in seconds
  snapshotInterval: 1800
server:
  # rest service address
  port: 8520

app:
  # Storage path, support multiple paths, separated by commas
  data-path: ./storage
  #raft-path: ./storage

spring:
  application:
    name: store-node-grpc-server
  profiles:
    active: default
    include: pd

logging:
  config: 'file:./conf/log4j2.xml'
  level:
    root: info

# ---------------------------------------------------------------------------
# Cloud Storage (pluggable provider – disabled by default)
# ---------------------------------------------------------------------------
# To enable, set enabled=true and add the desired provider JAR to the
# classpath (e.g. hg-store-cloud-s3-*.jar for Amazon S3 / S3-compatible).
#
# cloud:
#   storage:
#     enabled: true
#     provider: s3                         # must match CloudStorageProvider.providerName()
#     path-prefix: hugegraph               # key prefix inside the bucket
#     # --- Upload retry & dead-letter queue (common for all providers) ---
#     upload-retry-max-attempts: 5         # total attempts (initial + retries); default 5
#     upload-retry-initial-delay-ms: 1000  # delay before first retry (ms); default 1000
#     upload-retry-max-delay-ms: 60000     # exponential-backoff ceiling (ms); default 60000
#     # --- S3 provider settings (cloud.storage.s3.*) ---
#     s3:
#       bucket: hugegraph-store            # S3 bucket name
#       region: us-east-1                  # AWS region
#       endpoint:                          # custom S3-compatible endpoint (MinIO, Ceph...)
#       access-key: AKIAIOSFODNN7EXAMPLE   # omit to use the AWS default credentials chain
#       secret-key: wJalrXUtnFEMI/...      # omit to use the AWS default credentials chain
#       multipart-part-retry-max-attempts: 3
#       multipart-part-retry-base-backoff-ms: 1000
#       multipart-exhausted-direct-dlq: false
cloud:
  storage:
    enabled: false
    provider: s3
    path-prefix: hugegraph
    # 0 = no whole-file retries; provider handles its own retries. Queue is DLQ-only.
    # Set > 0 only for providers without built-in retry strategy.
    upload-retry-max-attempts: 0
    upload-retry-initial-delay-ms: 1000
    upload-retry-max-delay-ms: 60000
    s3:
      bucket:
      region:
      endpoint:
      access-key:
      secret-key:
      multipart-part-retry-max-attempts: 3
      multipart-part-retry-base-backoff-ms: 1000
      multipart-exhausted-direct-dlq: false

