management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

rocksdb:
  # rocksdb total memory usage, force flush to disk when reaching this value
  # TODO: default this lower, or size it from the container memory limit, or map it from an
  # HG_STORE_* variable in the Docker entrypoint. A default of 0 only makes AppConfig fall back
  # to the JVM max heap, which is another heap-sized native budget, not a safe container total.
  # It is the capacity of the RocksDB block and write LRU caches (RaftRocksdbOptions), not an
  # upfront allocation, but pinned at 32 GB those native caches can grow past a smaller
  # container memory limit under load and get the Store OOM-killed. Until then the only
  # override is the JVM system property -Drocksdb.total_memory_size=<bytes> (JAVA_OPTS, the
  # Helm chart's store.javaOpts; helm/hugegraph).
  # https://github.com/apache/hugegraph/issues/3254
  total_memory_size: 32000000000
  # memtable size used by rocksdb
  write_buffer_size: 32000000
  # For each rocksdb, the number of memtables reaches this value for writing to disk.
  min_write_buffer_number_to_merge: 16
