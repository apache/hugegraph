management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

rocksdb:
  # Match the explicit launcher opt-in when enabling Topling.
  provider: rocksdb
  # Off-heap memory for rocksdb memtables and block cache, in bytes. 0 sizes it from
  # the memory left after heap and direct memory (container limit aware, capped at 32 GB).
  total_memory_size: 0
  # memtable size used by rocksdb
  write_buffer_size: 32000000
  # For each rocksdb, the number of memtables reaches this value for writing to disk.
  min_write_buffer_number_to_merge: 16
