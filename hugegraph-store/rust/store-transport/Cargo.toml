[package]
name = "hugegraph-store-transport"
version = "0.1.0"
edition = "2021"
[dependencies]
hugegraph-store-core = { path = "../store-core" }
prost = "0.14.4"
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
prost-build = "0.14.4"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
