pdserver:
  # PD service address, multiple PD addresses separated by commas
  address: localhost:8686

grpc:
  # grpc service address
  host: 127.0.0.1
  port: 8500
  netty-server:
    max-inbound-message-size: 1000MB
raft:
  address: 127.0.0.1:8510
  max-log-file-size: 600000000000
  # Snapshot generation interval, unit: seconds
  snapshotInterval: 1800
server:
  # rest service address
  port: 8520

app:
  # Storage path, support multiple paths, separated by commas
  data-path: ./storage

spring:
  profiles:
    active: default
    include: pd
  application:
    name: store-node-grpc-server

logging:
  config: classpath:log4j2-dev.xml
  level:
    root: info

# Cloud storage (disabled by default; see hg-store-dist application.yml for full docs)
cloud:
  storage:
    enabled: false
    provider: s3
    path-prefix: hugegraph
    # 0 = no whole-file retries; provider handles its own retries. Queue is DLQ-only.
    # Set > 0 only for providers without built-in retry strategy.
    upload-retry-max-attempts: 0
    upload-retry-initial-delay-ms: 1000
    upload-retry-max-delay-ms: 60000
    s3:
      bucket:
      region:
      endpoint:
      access-key:
      secret-key:
      multipart-part-retry-max-attempts: 3
      multipart-part-retry-base-backoff-ms: 1000
      multipart-exhausted-direct-dlq: false

