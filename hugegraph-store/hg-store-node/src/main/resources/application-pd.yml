pdserver:
  # PD service address, multiple PD addresses separated by commas
  address: localhost:8686

management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  config: classpath:log4j2-dev.xml
  level:
    root: info
rocksdb:
  # Off-heap memory for rocksdb memtables and block cache: auto, or a number of bytes.
  # auto sizes it from the memory left after heap, direct memory and a reserve
  # (container limit aware, capped at 32 GB).
  total_memory_size: auto
  write_buffer_size: 32000000
