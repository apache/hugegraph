# bind url
# could use '0.0.0.0' or specified (real)IP to expose external network access
restserver.url=http://127.0.0.1:8080
#restserver.enable_graphspaces_filter=false
# gremlin server url, need to be consistent with host and port in gremlin-server.yaml
#gremlinserver.url=127.0.0.1:8182

graphs=./conf/graphs

# The maximum thread ratio for batch writing, only take effect if the batch.max_write_threads is 0
batch.max_write_ratio=80
batch.max_write_threads=0

# configuration of arthas
# Legacy aliases: arthas.telnetPort, arthas.httpPort, arthas.disabledCommands.
# The snake_case key takes precedence when both forms are configured.
# Different values for both forms produce a warning when the agent is activated.
arthas.telnet_port=8562
arthas.http_port=8561
# Defaults to local access. External binding (e.g. 0.0.0.0) exposes diagnostic commands;
# enable Arthas native authentication and restrict network access before exposing it.
# For API activation, set -Darthas.username=... -Darthas.password=... on the Server JVM.
# These credentials also apply to bin/arthas.sh; pass matching --username/--password for authenticated cleanup.
# Native loopback auth bypass is controlled by -Darthas.localConnectionNonAuth=false.
# Restart to apply JVM options; passwords in JVM arguments may appear in process listings.
arthas.ip=127.0.0.1
# Optional comma-separated disabled commands, for example jad,mc; empty allows all commands.
arthas.disabled_commands=

# authentication configs
#auth.authenticator=org.apache.hugegraph.auth.StandardAuthenticator
# for admin password, By default, it is pa and takes effect upon the first startup
#auth.admin_pa=pa
#auth.graph_store=hugegraph

# use pd
# usePD=true

# slow query log
log.slow_query_threshold=1000
# bytes of request body recorded as-is (may contain sensitive literals), 0 to disable
log.slow_query_body_limit=512

# jvm(in-heap) memory usage monitor, set 1 to disable it
memory_monitor.threshold=0.85
memory_monitor.period=2000
