# bind url
# could use '0.0.0.0' or specified (real)IP to expose external network access
restserver.url=http://127.0.0.1:8080
#restserver.enable_graphspaces_filter=false
# gremlin server url, need to be consistent with host and port in gremlin-server.yaml
#gremlinserver.url=127.0.0.1:8182

graphs=./conf/graphs

# task result streaming and logical pagination
restserver.task_result_page_size_max=1000
restserver.task_result_page_offset_max=100000
restserver.task_result_scan_uncompressed_bytes_max=268435456
restserver.task_result_scan_time_max=30
restserver.task_result_stream_time_max=60
restserver.task_result_active_streams_max=2
restserver.task_result_page_token_ttl=900
restserver.task_result_page_token_length_max=4096
# Configure one shared 32-byte Base64URL secret on every serving node.
#restserver.task_result_page_token_key_id=2026-08
#restserver.task_result_page_token_secret=BASE64URL_ENCODED_32_BYTE_KEY
#restserver.task_result_page_token_previous_key_id=
#restserver.task_result_page_token_previous_secret=

# The maximum thread ratio for batch writing, only take effect if the batch.max_write_threads is 0
batch.max_write_ratio=80
batch.max_write_threads=0

# configuration of arthas
arthas.telnet_port=8562
arthas.http_port=8561
arthas.ip=127.0.0.1
arthas.disabled_commands=jad

# authentication configs
#auth.authenticator=org.apache.hugegraph.auth.StandardAuthenticator
# for admin password, By default, it is pa and takes effect upon the first startup
#auth.admin_pa=pa
#auth.graph_store=hugegraph

# use pd
# usePD=true

# slow query log
log.slow_query_threshold=1000

# jvm(in-heap) memory usage monitor, set 1 to disable it
memory_monitor.threshold=0.85
memory_monitor.period=2000
