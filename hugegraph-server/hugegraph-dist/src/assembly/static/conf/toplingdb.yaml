# Community image defaults. Memory grows with databases and column families;
# these are individual native budgets, not a process memory limit.
http:
  auto_start_http: false
Cache:
  lru_cache:
    class: LRUCache
    params:
      capacity: 64M
MemTableRepFactory:
  skiplist:
    class: SkipList
    params:
      lookahead: 0
TableFactory:
  block_based:
    class: BlockBasedTable
    params:
      block_cache: "${lru_cache}"
CFOptions:
  default:
    memtable_factory: "${skiplist}"
    table_factory: block_based
    write_buffer_size: 16M
    max_write_buffer_number: 3
    merge_operator: uint64add
DBOptions:
  log:
    create_if_missing: true
    create_missing_column_families: true
  default:
    create_if_missing: true
    create_missing_column_families: false
    max_background_jobs: 2
    # Java WriteBatch does not carry Topling's mmap WAL references.
    memtable_as_log_index: false
