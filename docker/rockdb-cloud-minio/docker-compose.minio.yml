#
# MinIO standalone for local rocksdb-cloud backend testing.
#
# Usage:
#   Start:  docker compose -f docker/minio/docker-compose.minio.yml up -d
#   UI:     http://localhost:9001  (admin / minioadmin)
#   API:    http://localhost:9000
#   Stop:   docker compose -f docker/minio/docker-compose.minio.yml down -v
#
# Bucket created automatically: hugegraph-rocksdb
# Configure HugeGraph with:
#   backend=rocksdb-cloud
#   rocksdb.cloud.s3_bucket_name=hugegraph-rocksdb
#   rocksdb.cloud.s3_region=us-east-1
#   rocksdb.cloud.s3_object_prefix=hugegraph/
#   rocksdb.cloud.aws_access_key_id=minioadmin
#   rocksdb.cloud.aws_secret_access_key=minioadmin
#   rocksdb.cloud.s3_endpoint=http://localhost:9000
#   rocksdb.cloud.s3_path_style_access=true

services:
  minio:
    image: minio/minio:latest
    container_name: hg-minio-test
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console -> http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # One-shot service: creates the bucket then exits
  minio-init:
    image: minio/mc:latest
    container_name: hg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/hugegraph-rocksdb &&
        echo 'Bucket hugegraph-rocksdb created (or already exists)' &&
        exit 0
      "
    restart: "no"

volumes:
  minio-data:

