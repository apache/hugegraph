services:

  ranger-solr:
    image: solr:8.11
    container_name: ranger-solr
    # Loopback only: Solr has no auth, so audit records would be editable by
    # anyone reaching the host. Ranger uses ranger-solr:8983 on the compose network.
    ports:
      - "127.0.0.1:8983:8983"
    environment:
      SOLR_JAVA_MEM: "-Xms512m -Xmx512m"
    volumes:
      - ./solr-init.sh:/solr-init.sh:ro
      - ./ranger-audits-conf:/ranger-audits-conf:ro
    entrypoint: ["/solr-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s 'http://localhost:8983/solr/admin/cores?action=STATUS&core=ranger_audits&wt=json' | grep -q '\"status\":0' || exit 1"]
      interval: 10s
      start_period: 60s
      retries: 10

  ranger-db:
    image: postgres:14
    container_name: ranger-db
    environment:
      POSTGRES_DB: ranger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rangeradmin
      POSTGRES_HOST_AUTH_METHOD: trust
    # No published port: trust auth would let anyone reaching the host rewrite
    # Ranger policies. Ranger connects over the compose network (ranger-db:5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ranger"]
      interval: 10s
      retries: 10

  ranger:
    # Built from the stock apache/ranger:2.9.0 image (on a Java 17 JRE) with the thin
    # hugegraph-ranger-plugin jar baked onto Ranger Admin's classpath, so the
    # policy editor's resource autocomplete and "Test Connection" work out of
    # the box. See Dockerfile.ranger.
    build:
      context: ../..
      dockerfile: docker/hgRangerIntegration/Dockerfile.ranger
    image: ranger-hugegraph-local:2.9.0
    # Local-only tag: build it instead of trying to pull it from a registry.
    pull_policy: build
    container_name: ranger
    depends_on:
      ranger-db:
        condition: service_healthy
      ranger-solr:
        condition: service_healthy
    # Read by the image's /home/ranger/scripts/ranger.sh on first start; the DB
    # host/name and the Solr audit URL come from its bundled install.properties
    # (ranger-db, ranger, http://ranger-solr:8983/solr/ranger_audits).
    # RANGER_DB_PASSWORD is also used as the Ranger Admin UI password for "admin".
    environment:
      POSTGRES_PASSWORD: rangeradmin
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: "rangerR0cks!"
    ports:
      - "6080:6080"
    # login.jsp is static and answers 200 even when Admin has no database, so
    # probe an authenticated, DB-backed API instead.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O/dev/null --auth-no-challenge --user=admin --password='rangerR0cks!' http://localhost:6080/service/public/v2/api/servicedef/name/hdfs || exit 1"]
      interval: 15s
      start_period: 180s
      retries: 20

  hugegraph:
    build:
      context: ../..
      dockerfile: docker/hgRangerIntegration/Dockerfile.hugegraph
    image: hugegraph-ranger-local:latest
    pull_policy: build
    container_name: hugegraph
    depends_on:
      ranger:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./ranger-hugegraph-security.xml:/hugegraph-server/conf/ranger-hugegraph-security.xml:ro
      - ./rest-server.properties:/hugegraph-server/conf/rest-server.properties:ro
      - ./hugegraph.properties:/hugegraph-server/conf/graphs/hugegraph.properties:ro
