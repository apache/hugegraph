# Convenience preset: single-node / local kind-minikube development.
# Usage: helm install hg ./helm/hugegraph -f values-single.yaml

pd:
  replicas: 1
  antiAffinity: disabled
  pdb:
    enabled: false
  storage:
    size: 5Gi

store:
  replicas: 1
  antiAffinity: disabled
  pdb:
    enabled: false
  storage:
    size: 10Gi

server:
  replicas: 1
  hpa:
    enabled: false
  auth:
    enabled: true
    admin:
      autoGenerate: true
    token:
      autoGenerate: true
