# Default values for HugeGraph HStore Helm chart.
# See values-single.yaml and values-cluster.yaml for presets.

# easy: browser/API NodePorts; strict: internal Services and NetworkPolicy.
# Explicit component parameters always override these mode defaults.
mode: easy
global:
  imageRegistry: ""
persistence:
  enabled: true

fullnameOverride: ""
nameOverride: ""

imagePullSecrets: []

pd:
  replicas: 3
  image:
    repository: hugegraph/pd
    # TODO: leave tag empty to inherit Chart.appVersion after the 1.8.0
    # release images are published. Pin a tag or digest for production.
    tag: latest
    # Optional immutable digest, for example sha256:abc...  When set it wins over
    # tag and the image is pulled by digest, which is what a release gate should
    # assert instead of a mutable tag.
    digest: ""
    pullPolicy: Always
  # Empty preserves the image entrypoint's automatic JVM sizing. The chart
  # renders its partition settings below as -D system properties ahead of
  # this value, so flags placed here win on conflict.
  javaOpts: ""
  # Partition sharding, rendered as -D system properties that outrank the
  # image's conf/application.yml. PD copies both values into its own
  # persisted metadata at first bootstrap only; from then on the stored
  # values are authoritative, so changing these later (or scaling
  # store.replicas across the derivation boundary) has no effect on an
  # initialized cluster. Post-bootstrap changes go through PD's config API
  # and take effect on existing shard groups only when a partition patrol
  # is triggered; see the README's Partition Sharding section.
  partition:
    # Shard replicas per partition, seeding PD at first bootstrap only.
    # Empty derives 3 when store.replicas is at least 3, else 1, so a fresh
    # multi-store install gets store-level HA instead of the image default
    # of 1. The derivation skips 2 because PD clamps a shard count of 2 to
    # 1 (two shards cannot elect a leader). An explicit value must be odd
    # and must not exceed store.replicas.
    defaultShardCount: ""
    # Maximum shards per store, seeding PD at first bootstrap only. Also
    # fixes the initial partition count: store.replicas x this value /
    # shard count. The derived shard count of 3 gives the default topology
    # 12 partitions instead of 36; raise this value to compensate when more
    # partitions are wanted. Empty preserves the image default of 12.
    storeMaxShardCount: ""
  ports:
    grpc: 8686
    rest: 8620
    raft: 8610
  dataPath: /hugegraph-pd/pd_data
  # PD REST Basic-auth credential. PD compares the password of every /v1
  # request against auth.secret-key and refuses to start without one
  # (HG_PD_AUTH_SECRET_KEY). The chart hands the same value to the Server
  # storage wait (PD_AUTH_PASSWORD, user store) and to Hubble
  # (operations.pd.password, user hubble). The Secret is kept on uninstall
  # like the Server auth Secrets. The value must be printable ASCII with
  # no leading whitespace and no backslashes: it is written into Hubble's
  # Java properties file, which strips leading whitespace, unescapes
  # backslashes, and reads the file as ISO-8859-1. Priority:
  # existingSecret > value > autoGenerate.
  auth:
    # Optional plaintext secret (prefer existingSecret in shared clusters).
    value: ""
    # Pre-created Secret name. Must contain the key below; chart does not manage it.
    existingSecret: ""
    key: secret-key
    # When existingSecret and value are empty, create a kept release-pd-auth Secret.
    autoGenerate: true
  storage:
    # Unset inherits persistence.enabled; false uses temporary emptyDir.
    enabled:
    size: 10Gi
    storageClassName: ""
  resources: {}
  # Pod-level and container-level securityContext. Empty by default because the
  # published images run as root; set these to satisfy a restricted namespace.
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # required | preferred | disabled. "preferred" schedules on clusters with
  # fewer nodes than replicas; production should use "required" (see
  # values-cluster.yaml) so one node failure cannot take out PD quorum.
  antiAffinity: preferred
  # Scheduling. `affinity` takes precedence over the antiAffinity preset.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Extra environment variables appended to the pd container.
  extraEnv: []
  # Gives a JVM with an on-disk store time to shut down cleanly on drain.
  terminationGracePeriodSeconds: 300
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # This chart makes no Kubernetes API calls, so no token is mounted.
    automountServiceAccountToken: false
  # Client Service for PD REST/gRPC. Defaults to ClusterIP for in-cluster
  # consumers (Server, Store, in-chart Hubble). Set type to NodePort or
  # LoadBalancer when an outside Hubble must reach PD for discovery.
  service:
    type: ClusterIP
    annotations: {}
    # Legacy acknowledgement, accepted for compatibility; no render gate.
    allowInsecureExposure: false
    # Optional fixed NodePorts; require service.type NodePort or LoadBalancer.
    restNodePort:
    grpcNodePort:
  pdb:
    enabled: true
    minAvailable: 2
  # PD's raft IP whitelist resolves peers once at boot, which under
  # Kubernetes blocks peers whose pod IPs were not yet published or change
  # later. Off by default in-cluster (upstream switch
  # raft.ip-whitelist.enabled); k8s network policy/auth owns that layer.
  # Set true to restore the image default.
  raftIpWhitelistEnabled: false
  # Raft RPC timeout in milliseconds, rendered as -Draft.rpc-timeout. A
  # vanished (not crashed) leader is waited on for this long per attempt, so
  # the image default of 10000 leaves the cluster leaderless for about a
  # minute where 3000 elects a new leader in seconds. Empty preserves the
  # image default.
  raftRpcTimeoutMs: 3000
  # Explicit rollout strategy instead of the implicit StatefulSet default.
  updateStrategy:
    type: RollingUpdate
  # Keep graph metadata PVCs across delete and scale-down; data outlives the
  # workload by default. Set to Delete for disposable environments. Honored
  # on Kubernetes >=1.27 (or with the StatefulSetAutoDeletePVC feature gate);
  # older API servers drop the field, which matches Retain behavior anyway.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # Startup can take a while during Raft bootstrap
  # HTTP path the PD readinessProbe hits. /v1/ready answers 503 while there
  # is no raft leader, so a PD outside the quorum stops passing readiness.
  # Startup and liveness stay on /v1/health so a PD that merely lost its
  # leader is not restarted.
  readinessPath: /v1/ready
  # HTTP path the PD startup and liveness probes hit. Empty derives it from
  # the replica count: /v1/health with more than one PD, so a normal election
  # never restarts a follower, and /v1/ready with a single PD, which has no
  # election to lose. Older images otherwise pass /v1/health forever after
  # losing leadership for good (apache/hugegraph#3222). Startup follows liveness so
  # the boot-to-ready window sits inside the startup budget.
  # TODO: drop the single-PD readiness derivation once the minimum supported image
  # includes the /v1/health fatal Raft error fix for apache/hugegraph#3222.
  livenessPath: ""
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    liveness:
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 5

store:
  replicas: 3
  image:
    repository: hugegraph/store
    # TODO: leave tag empty to inherit Chart.appVersion after the 1.8.0
    # release images are published. Pin a tag or digest for production.
    tag: latest
    # Optional immutable digest, for example sha256:abc...  When set it wins over
    # tag and the image is pulled by digest, which is what a release gate should
    # assert instead of a mutable tag.
    digest: ""
    pullPolicy: Always
  # Empty preserves the image entrypoint's automatic JVM sizing.
  javaOpts: ""
  ports:
    grpc: 8500
    raft: 8510
    rest: 8520
  dataPath: /hugegraph-store/storage
  storage:
    # Unset inherits persistence.enabled; false uses temporary emptyDir.
    enabled:
    size: 50Gi
    storageClassName: ""
  resources: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # required | preferred | disabled. "preferred" schedules on clusters with
  # fewer nodes than replicas; production should use "required" (see
  # values-cluster.yaml) so one node failure cannot co-locate shard replicas.
  antiAffinity: preferred
  # Scheduling. `affinity` takes precedence over the antiAffinity preset.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Extra environment variables appended to the store container.
  extraEnv: []
  # Gives a JVM with an on-disk store time to shut down cleanly on drain.
  terminationGracePeriodSeconds: 300
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # This chart makes no Kubernetes API calls, so no token is mounted.
    automountServiceAccountToken: false
  pdb:
    enabled: true
    minAvailable: 2
  # Optional tool image override; empty reuses the Store image.
  waitImage: ""
  # HTTP path the init container polls on every PD peer; a majority must
  # answer 2xx before the Store starts. /v1/ready makes that majority a
  # raft quorum instead of a set of live listeners.
  waitPath: /v1/ready
  # Bound the PD wait so a cluster whose PDs never come up fails visibly
  # instead of sitting in Init:0/1 forever.
  waitTimeoutSeconds: 900
  # Optional bounds for the PD wait init container.
  waitResources: {}
  # Explicit rollout strategy instead of the implicit StatefulSet default.
  updateStrategy:
    type: RollingUpdate
  # Keep graph data PVCs across delete and scale-down; data outlives the
  # workload by default. Set to Delete for disposable environments.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  probes:
    startup:
      failureThreshold: 40
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    liveness:
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 5

server:
  replicas: 3
  # DEFAULT preserves the image config; non-default values select PD service metadata.
  # serviceId accepts printable ASCII, including spaces and backslashes.
  # Create a non-default graph space before starting a Server assigned to it.
  serviceId: DEFAULT
  graphSpace: DEFAULT
  image:
    repository: hugegraph/server
    # TODO: leave tag empty to inherit Chart.appVersion after the 1.8.0
    # release images are published. Pin a tag or digest for production.
    tag: latest
    # Optional immutable digest, for example sha256:abc...  When set it wins over
    # tag and the image is pulled by digest, which is what a release gate should
    # assert instead of a mutable tag.
    digest: ""
    pullPolicy: Always
  # Empty preserves the image entrypoint's automatic JVM sizing.
  javaOpts: ""
  port: 8080
  # HTTP path the Server readinessProbe hits. /readiness (apache/hugegraph#3212)
  # answers 503 while the Server cannot serve graph traffic, so such a Server
  # drops out of the Service instead of answering 500 to every graph request.
  # Keep /versions on Server images that do not serve it. Startup and liveness
  # stay on /versions so a Server that merely lost its storage is not restarted.
  readinessPath: /versions
  backend: hstore
  resources: {}
  # Server is stateless and may scale past the node count via HPA, so the
  # default only prefers spreading. Use "required" when replicas are always
  # fewer than schedulable nodes.
  # required | preferred | disabled
  antiAffinity: preferred
  # Scheduling. `affinity` takes precedence over the antiAffinity preset.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Extra environment variables appended to the server container.
  extraEnv: []
  # Allows in-flight requests to drain before the Server is stopped.
  terminationGracePeriodSeconds: 60
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # This chart makes no Kubernetes API calls, so no token is mounted.
    automountServiceAccountToken: false
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # Server has no quorum to preserve, so no PodDisruptionBudget by default.
  pdb:
    enabled: false
    minAvailable: 2
  # Optional Helm test image override; empty reuses the Server image.
  waitImage: ""
  # Existing Gremlin graph binding checked on every Server Pod. Select the
  # target graph explicitly; graphSpace does not create or infer this binding.
  testGraphAlias: DEFAULT-hugegraph
  # Optional Gremlin assertions, run with the hook's Server credential on every Pod.
  # Supply trusted read-only scripts; read-only execution is not enforced.
  # Use --set-file server.testGremlin=/path/to/assertions.groovy; assert expected results.
  testGremlin: ""
  # Resources for the Helm test hook container. Bounded by default so the hook
  # cannot run unlimited on a restricted or quota-managed namespace.
  testResources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 64Mi
  # Distributed HStore: the init-store gate must be explicitly false, so that
  # concurrent Server replicas never initialize the same backend. No
  # HG_SERVER_SKIP_INIT and no init Job.
  initStoreEnabled: false
  # Maximum storage wait; startup probe defaults adapt to this value.
  storageWaitTimeoutSeconds: 300
  auth:
    # On by default: a chart-managed release-admin Secret supplies the password
    # unless admin.existingSecret or admin.password is set. Set enabled=false
    # only for trusted networks.
    enabled: true
    # Admin password: inline value vs Kubernetes Secret name are separate keys.
    # Priority: existingSecret > password > autoGenerate.
    admin:
      # Optional plaintext password (prefer existingSecret in shared clusters).
      password: ""
      # Pre-created Secret name. Must contain key below; chart does not manage it.
      existingSecret: ""
      key: password
      # When existingSecret and password are empty, create a kept release-admin Secret.
      autoGenerate: true
    # JWT signing key for auth.token_secret / HG_SERVER_AUTH_TOKEN_SECRET.
    # Must be identical on every Server replica or Hubble login fails behind
    # the Service. Priority: existingSecret > value > autoGenerate.
    token:
      # Optional plaintext signing key (prefer existingSecret in shared clusters).
      value: ""
      # Pre-created Secret name. Chart does not manage it.
      existingSecret: ""
      key: token_secret
      # When existingSecret and value are empty, create a kept release-auth-token Secret.
      autoGenerate: true
  # URL announced to PD via server.urls_to_pd for discovery clients such as Hubble.
  # Empty announces each Server Pod IP so in-cluster clients retain the full replica list.
  # Set this to a URL reachable from outside the cluster (NodePort, LoadBalancer, or Ingress) when an external Hubble uses PD mode; all replicas then announce that shared logical endpoint.
  advertiseUrl: ""
  service:
    # Unset inherits mode (easy: NodePort, strict: ClusterIP).
    type:
    annotations: {}
    # Legacy acknowledgement, accepted for compatibility; no render gate.
    allowInsecureExposure: false
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: hugegraph.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  hpa:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  probes:
    startup:
      # A first probe can run immediately; (failureThreshold - 1) * periodSeconds
      # must cover the storage wait plus at least 120 seconds for Server startup.
      # Unset derives a budget from storageWaitTimeoutSeconds.
      failureThreshold:
      periodSeconds: 5
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    liveness:
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 5

# Hubble UI is enabled by default; disable with hubble.enabled=false.
hubble:
  enabled: true
  # pd: discover the cluster through PD (enables the cluster operations view).
  # direct: talk to the Server client Service only, without PD discovery.
  # Current Hubble images require server.auth to be enabled: the UI login
  # authenticates against the cluster, so rendering fails otherwise unless
  # allowWithoutServerAuth explicitly overrides for images that support it.
  mode: pd
  allowWithoutServerAuth: false
  image:
    repository: hugegraph/hubble
    # Tracks latest until the next HugeGraph release tag is published. Pin the
    # tag (or digest) and switch to IfNotPresent for production.
    tag: latest
    # Optional immutable digest, for example sha256:abc...  When set it wins over
    # tag and the image is pulled by digest, which is what a release gate should
    # assert instead of a mutable tag.
    digest: ""
    pullPolicy: Always
  port: 8088
  # Keeps Hubble's per-instance H2 metadata across Pod replacement; see the
  # README's Hubble section for the single-replica and H2 constraints.
  # size and storageClassName apply at install time only; the PVC is kept
  # on helm uninstall.
  persistence:
    # Unset inherits persistence.enabled.
    enabled:
    size: 1Gi
    storageClassName: ""
  resources: {}
  # When persistence is enabled and the pod runs as non-root, set a matching
  # fsGroup here so H2 can write /hubble-data.
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Extra environment variables appended to the hubble container.
  extraEnv: []
  terminationGracePeriodSeconds: 30
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # This chart makes no Kubernetes API calls, so no token is mounted.
    automountServiceAccountToken: false
  service:
    # Unset inherits mode (easy: NodePort, strict: ClusterIP).
    type:
    annotations: {}
    # Legacy acknowledgement, accepted for compatibility; no render gate.
    allowInsecureExposure: false
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: hubble.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # Legacy acknowledgement, accepted for compatibility.
    allowPlainHttp: false
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 5
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    liveness:
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 5

# Kubernetes NetworkPolicy: mode default plus explicit per-component rules.
# easy does not isolate clients; strict isolates release traffic and DNS. Only
# enforced when the network plugin implements NetworkPolicy (kind v0.25+,
# k3s, Calico, Cilium); elsewhere the objects are accepted and do nothing.
# Nothing outside the release is admitted unless it is listed in
# <component>.extraIngress as standard NetworkPolicy ingress rules: apps in
# other namespaces, Prometheus, Vermeer, and the Ingress controller. Exposing
# a component does not automatically add callers: configure extraIngress
# and extraEgress using native Kubernetes NetworkPolicy rules.
networkPolicy:
  # Unset inherits mode (easy: false, strict: true).
  enabled:
  pd:
    extraIngress: []
  store:
    extraIngress: []
  server:
    extraIngress: []
  hubble:
    extraIngress: []
    # For Hubble's optional outside endpoints (es.urls, prometheus.url set
    # through extraEnv). PD, Store and Server reach only the release and DNS.
    extraEgress: []

# No init Job; see README.md for the HStore initialization contract.
# Install with: helm install ... --wait   (no --wait-for-jobs)
