# Production starting point: 3 Server + 3 PD + 3 Store.
# Size this profile again for the real graph, traffic, and failure budget.
# Usage: helm install hg ./helm/hugegraph -f values-cluster.yaml

pd:
  replicas: 3
  javaOpts: >-
    -Xms256m -Xmx512m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=256m
    -XX:+UseContainerSupport
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # Pinned to "required": production must not co-locate PD quorum members.
  antiAffinity: required
  pdb:
    enabled: true
    minAvailable: 2
  storage:
    size: 10Gi

store:
  replicas: 3
  javaOpts: >-
    -Xms512m -Xmx1024m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=512m
    -XX:+UseContainerSupport
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  waitResources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 64Mi
  # Pinned to "required": production must not co-locate shard replicas.
  antiAffinity: required
  pdb:
    enabled: true
    minAvailable: 2
  storage:
    size: 50Gi

server:
  replicas: 3
  javaOpts: >-
    -Xms512m -Xmx1024m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=256m
    -XX:+UseContainerSupport
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi
  hpa:
    enabled: false

# The optional Hubble UI is not enabled here: this preset does not enable
# server authentication, and current Hubble images cannot complete their
# login against an auth-less cluster. Enable it together with server.auth,
# starting from:
#
# hubble:
#   enabled: true
#   persistence:
#     enabled: true
#     size: 1Gi
#   resources:
#     requests:
#       cpu: 250m
#       memory: 768Mi
#     limits:
#       cpu: "1"
#       memory: 1536Mi
