# Multi-node starting point: 3 Server + 3 PD + 3 Store.
# Size this profile again for the real graph, traffic, and failure budget.
# Usage: helm install hg ./helm/hugegraph -f values-cluster.yaml
# Entry and network policy inherit mode (easy by default).
# Add --set mode=strict for ClusterIP and NetworkPolicy, or override either explicitly.

pd:
  replicas: 3
  javaOpts: >-
    -Xms256m -Xmx512m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=256m
    -XX:+UseContainerSupport
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # Keep PD quorum members on separate nodes.
  antiAffinity: required
  pdb:
    enabled: true
    minAvailable: 2
  storage:
    size: 10Gi

store:
  replicas: 3
  # Store readiness is listener-only (/v1/health), so an automatic rolling
  # update can replace the next Store while the previous one is still
  # restoring its partitions. OnDelete stops automatic advancement; it is
  # not by itself a safety proof: the manual one-at-a-time procedure with
  # its per-group database checks (README, Upgrading) still applies.
  updateStrategy:
    type: OnDelete
  javaOpts: >-
    -Xms512m -Xmx1024m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=512m
    -XX:+UseContainerSupport
  # Container limits do not configure the JVM heap; javaOpts does. Store images
  # with auto-sized RocksDB memory (apache/hugegraph#3254) give RocksDB half of
  # the container limit left after heap, direct memory and a 1.5 GiB reserve;
  # with this preset that is 2.5 GiB. Set store.extraEnv
  # HG_STORE_ROCKSDB_TOTAL_MEMORY_SIZE (bytes) to use a different value.
  resources:
    requests:
      cpu: "1"
      memory: 5Gi
    limits:
      cpu: "4"
      memory: 8Gi
  waitResources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 64Mi
  # Pinned to "required": production must not co-locate shard replicas.
  antiAffinity: required
  pdb:
    enabled: true
    minAvailable: 2
  storage:
    size: 50Gi

server:
  replicas: 3
  javaOpts: >-
    -Xms512m -Xmx1024m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=256m
    -XX:+UseContainerSupport
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi
  hpa:
    enabled: false
  # Keep at least two Servers through voluntary evictions such as node
  # drains; the default leaves the PDB off because Server holds no quorum.
  pdb:
    enabled: true
    minAvailable: 2
  # Auth is on by default (chart-managed admin Secret). Pin it here so a
  # production overlay cannot accidentally drop authentication.
  auth:
    enabled: true
    admin:
      autoGenerate: true
    token:
      autoGenerate: true

# Hubble is enabled by default. Disable with --set hubble.enabled=false.
# The optional resource override below remains available when needed.
#
# hubble:
#   enabled: true
#   persistence:
#     enabled: true
#     size: 1Gi
#   resources:
#     requests:
#       cpu: 250m
#       memory: 768Mi
#     limits:
#       cpu: "1"
#       memory: 1536Mi

# Network isolation is selected by mode or an explicit enabled override.

# Optional computation follows this preset only when explicitly enabled.
vermeer:
  enabled: false
  mode: cluster
