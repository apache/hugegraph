# Optional HugeGraph RAG overlay. Layer it after values-single.yaml or
# values-cluster.yaml. The same-release Server address, port, graph identity
# and administrator Secret are derived by the chart and need no duplication.
rag:
  enabled: true
  image:
    repository: hugegraph/rag
    tag: latest
    digest: ''
    pullPolicy: Always
  port: 8001

  # Keep this true for a Server deployed by the same Helm release. Configure
  # url/graphName/graphSpace/username/passwordSecret only for an external or
  # deliberately separate HugeGraph deployment; see docs/rag.md.
  hugegraph:
    autoConfigure: true

  # The main RAG process has no universal resource profile because model,
  # embedding and indexing workloads vary widely. Size it for the selected
  # providers and dataset.
  resources: {}
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  # Safe non-root UID/GID/fsGroup 1000 and RuntimeDefault seccomp are built
  # into the templates, including bare --set rag.enabled=true installs.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ''
  podAnnotations: {}
  podLabels: {}
  env: []
  envFrom: []
  terminationGracePeriodSeconds: 30

  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountServiceAccountToken: false

  # RAG stays internal by default because the application login does not
  # protect every HTTP route. Expose it only behind a reviewed auth boundary.
  service:
    type: ClusterIP
    nodePort: null
    annotations: {}
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts:
    - host: rag.local
      paths:
      - path: /
        pathType: Prefix
    tls: []

  # Persistence defaults on when RAG is enabled. The claim stores the editable
  # resource tree, generated .env model/graph settings and prompt YAML. The
  # init container adds missing files from a new image but never overwrites
  # files already changed on the claim.
  persistence:
    enabled: true
    existingClaim: ''
    size: 10Gi
    storageClassName: ''
    accessModes:
    - ReadWriteOnce
    mountPath: /home/work/hugegraph-llm/src/hugegraph_llm/resources

  extraVolumes: []
  extraVolumeMounts: []
  probes:
    startup:
      path: /
      failureThreshold: 60
      periodSeconds: 5
      timeoutSeconds: 3
    readiness:
      path: /
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      path: /
      failureThreshold: 3
      periodSeconds: 20
      timeoutSeconds: 3
  networkPolicy:
    extraIngress: []
    extraEgress: []
