# Optional HugeGraph RAG overlay. Layer it after values-single.yaml or
# values-cluster.yaml; topology presets retain their own RAG replica count.
rag:
  enabled: true
  image:
    repository: hugegraph/rag
    tag: latest
    digest: ''
    pullPolicy: Always
  port: 8001
  hugegraph:
    autoConfigure: true
    url: ''
    graphName: hugegraph
    graphSpace: ''
    username: admin
    passwordSecret:
      name: ''
      key: ''
  resources: {}
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ''
  podAnnotations: {}
  podLabels: {}
  env: []
  envFrom: []
  terminationGracePeriodSeconds: 30
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountServiceAccountToken: false
  service:
    type: null
    nodePort: null
    annotations: {}
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts:
    - host: rag.local
      paths:
      - path: /
        pathType: Prefix
    tls: []
  persistence:
    enabled: false
    existingClaim: ''
    size: 10Gi
    storageClassName: ''
    accessModes:
    - ReadWriteOnce
    mountPath: /home/work/hugegraph-llm/src/hugegraph_llm/resources
  extraVolumes: []
  extraVolumeMounts: []
  probes:
    startup:
      path: /
      failureThreshold: 60
      periodSeconds: 5
      timeoutSeconds: 3
    readiness:
      path: /
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      path: /
      failureThreshold: 3
      periodSeconds: 20
      timeoutSeconds: 3
  networkPolicy:
    extraIngress: []
    extraEgress: []
