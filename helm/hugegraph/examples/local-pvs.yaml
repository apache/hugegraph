apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hugegraph-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hugegraph-pd-0
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hugegraph-local
  claimRef:
    namespace: hugegraph
    name: pd-data-hugegraph-pd-0
  local:
    path: /var/lib/hugegraph/pd-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-1]
---
