# First create the graph selected by HG_GRAPH_SPACE/HG_GRAPH_NAME (default DEFAULT/graph_a).
# Helm configures the same-release HugeGraph address and Secret credential references.
env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    row.num = 10
    schema {
      fields {
        name = "string"
        age = "int"
      }
    }
    rows = [
      { kind = INSERT, fields = ["person_01", 21] },
      { kind = INSERT, fields = ["person_02", 22] },
      { kind = INSERT, fields = ["person_03", 23] },
      { kind = INSERT, fields = ["person_04", 24] },
      { kind = INSERT, fields = ["person_05", 25] },
      { kind = INSERT, fields = ["person_06", 26] },
      { kind = INSERT, fields = ["person_07", 27] },
      { kind = INSERT, fields = ["person_08", 28] },
      { kind = INSERT, fields = ["person_09", 29] },
      { kind = INSERT, fields = ["person_10", 30] }
    ]
  }
}

sink {
  HugeGraph {
    host = ${HG_HOST}
    port = ${HG_PORT}
    protocol = ${HG_PROTOCOL}
    graph_space = ${HG_GRAPH_SPACE}
    graph_name = ${HG_GRAPH_NAME}
    username = ${HG_USERNAME}
    password = ${HG_PASSWORD}
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    mappings = [
      {
        type = "VERTEX"
        label = "seatunnel_demo_person"
        idStrategy = "PRIMARY_KEY"
        idFields = ["name"]
        properties = ["name", "age"]
      }
    ]
  }
}
