# Existing graph A -> empty graph B; copy exact Schema first through HugeGraph API.
env { job.mode = BATCH, parallelism = 1 }
source {
  HugeGraph {
    host = ${HG_SOURCE_HOST}
    port = ${HG_SOURCE_PORT}
    protocol = ${HG_SOURCE_PROTOCOL}
    graph_space = DEFAULT
    graph_name = graph_a
    username = ${HG_SOURCE_USERNAME}
    password = ${HG_SOURCE_PASSWORD}
    label = "company"
    label_type = VERTEX
    page_size = 100
    time_zone = UTC
  }
}
sink {
  HugeGraph {
    host = ${HG_TARGET_HOST}
    port = ${HG_TARGET_PORT}
    protocol = ${HG_TARGET_PROTOCOL}
    graph_space = DEFAULT
    graph_name = graph_b
    username = ${HG_TARGET_USERNAME}
    password = ${HG_TARGET_PASSWORD}
    schema_save_mode = ERROR_WHEN_SCHEMA_NOT_EXIST
    check_vertex = true
    batch_size = 100
    mappings = [
      {
        type = VERTEX
        label = company
        timeZone = UTC
        idStrategy = CUSTOMIZE_NUMBER
        idFields = ["~id"]
      }
    ]
  }
}
