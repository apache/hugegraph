# Run hugegraph-sink.conf first, then read the ten example vertices from the same graph.
env {
  job.mode = BATCH
  parallelism = 1
}

source {
  HugeGraph {
    host = ${HG_HOST}
    port = ${HG_PORT}
    protocol = ${HG_PROTOCOL}
    graph_space = ${HG_GRAPH_SPACE}
    graph_name = ${HG_GRAPH_NAME}
    username = ${HG_USERNAME}
    password = ${HG_PASSWORD}
    label = seatunnel_demo_person
    label_type = VERTEX
    page_size = 100
    time_zone = UTC
  }
}

sink {
  Console {}
}
