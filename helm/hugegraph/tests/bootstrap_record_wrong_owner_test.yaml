suite: Bootstrap rejects another release's retained record
templates:
- store-statefulset.yaml
set:
  fullnameOverride: cluster
  bootstrap.enabled: true
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 3
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 2
release:
  upgrade: true
kubernetesProvider:
  scheme:
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
  objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-bootstrap
      namespace: NAMESPACE
      labels:
        app.kubernetes.io/instance: another-release
    data:
      schemaVersion: '1'
      pdReplicas: '3'
      storeReplicas: '3'
      initialStoreCount: '3'
tests:
- it: fails closed when retained history belongs to another release
  template: store-statefulset.yaml
  asserts:
  - failedTemplate:
      errorPattern: bootstrap ConfigMap belongs to another release
