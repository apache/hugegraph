suite: Helm test hook is resource bounded
templates:
  - tests/test-connection.yaml
tests:
  - it: bounds the test hook by default so quota-managed namespaces accept it
    asserts:
      - exists:
          path: spec.containers[0].resources.limits.cpu
      - exists:
          path: spec.containers[0].resources.limits.memory
      - exists:
          path: spec.containers[0].resources.requests.cpu
      - exists:
          path: spec.containers[0].resources.requests.memory

  - it: lets an operator override the hook resources
    set:
      server.testResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.containers[0].resources.limits.cpu
          value: 500m
