suite: PD REST auth Secret wiring
tests:
  - it: creates a kept release-pd-auth Secret by default
    template: pd-auth-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pd-auth
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - isNotEmpty:
          path: data["secret-key"]

  - it: renders no Secret when an operator-supplied Secret is named
    template: pd-auth-secret.yaml
    set:
      pd.auth.existingSecret: my-pd-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: hands PD the secret from the Secret, never a literal value
    template: pd-statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_PD_AUTH_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-pd-auth
                key: secret-key
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/pd-auth"]

  - it: gives the Server storage wait the same secret as PD_AUTH_PASSWORD
    template: server-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PD_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-pd-auth
                key: secret-key
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/pd-auth"]

  - it: gives Hubble the secret and writes it into the properties file
    template: hubble-deployment.yaml
    set:
      hubble.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_HUBBLE_PD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-pd-auth
                key: secret-key
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "operations\\.pd\\.username=hubble"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "operations\\.pd\\.password=%s"
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/pd-auth"]

  - it: points PD at the operator-supplied Secret and key
    template: pd-statefulset.yaml
    set:
      pd.auth.existingSecret: my-pd-secret
      pd.auth.key: pd-pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_PD_AUTH_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: my-pd-secret
                key: pd-pass

  - it: points the Server storage wait at the operator-supplied Secret and key
    template: server-deployment.yaml
    set:
      pd.auth.existingSecret: my-pd-secret
      pd.auth.key: pd-pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PD_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-pd-secret
                key: pd-pass

  - it: rejects a configuration with no secret source
    template: pd-statefulset.yaml
    set:
      pd.auth.autoGenerate: false
    asserts:
      # The values schema refuses this before the template guard can; the
      # guard still exists for values that bypass schema validation.
      - failedTemplate:
          errorPattern: "pd/auth|pd.auth requires"

  - it: rejects operator overrides of the chart-managed PD_AUTH_PASSWORD
    template: server-deployment.yaml
    set:
      server.extraEnv:
        - name: PD_AUTH_PASSWORD
          value: x
    asserts:
      - failedTemplate:
          errorPattern: "server.extraEnv must not set the chart-managed variable PD_AUTH_PASSWORD"
