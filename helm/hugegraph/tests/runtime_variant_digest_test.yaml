suite: Topling runtime digest selection
templates:
  - runtime-variant-validation.yaml
tests:
  - it: rejects a digest that would override the selected PD Topling tag
    set:
      global.runtimeVariant: topling
      pd.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "pd.image.digest cannot be used with global.runtimeVariant=topling"

  - it: rejects a digest that would override the selected Store Topling tag
    set:
      global.runtimeVariant: topling
      store.image.digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - failedTemplate:
          errorPattern: "store.image.digest cannot be used with global.runtimeVariant=topling"

  - it: rejects a digest that would override the selected Server companion tag
    set:
      global.runtimeVariant: topling
      server.image.digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    asserts:
      - failedTemplate:
          errorPattern: "server.image.digest cannot be used with global.runtimeVariant=topling"
