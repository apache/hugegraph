suite: Cluster preset Store memory
values:
  - ../values-cluster.yaml
tests:
  - it: gives the Store room for the caches the image commits outside its heap
    template: store-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 8Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 5Gi

  - it: keeps the Store heap flags the memory budget is derived from
    template: store-statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="JAVA_OPTS")].value
          pattern: -Xmx1024m
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="JAVA_OPTS")].value
          pattern: -XX:MaxDirectMemorySize=512m
