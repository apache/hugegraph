suite: Image reference and digest pinning
tests:
  - it: renders repository and tag when no digest is set
    template: pd-statefulset.yaml
    set:
      pd.image.tag: pinned-for-test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: hugegraph/pd:pinned-for-test

  - it: pins by digest when one is supplied, ignoring the tag
    template: pd-statefulset.yaml
    set:
      pd.image.digest: sha256:43999a5ccda34883a9e4e458e25cb903ce34adbc66782d9f4a5260d68b2b5a82
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: hugegraph/pd@sha256:43999a5ccda34883a9e4e458e25cb903ce34adbc66782d9f4a5260d68b2b5a82
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "helm-dev"

  - it: supports digest pinning on store as well
    template: store-statefulset.yaml
    set:
      store.image.digest: sha256:458d77a18542e8a2f7980b075f2fda32026d582200a8983921354398467ff860
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^hugegraph/store@sha256:458d77a1"

  - it: supports digest pinning on server as well
    template: server-deployment.yaml
    set:
      server.image.digest: sha256:30f99c6b9ab605accf96e9c179434b13495547f532dcb89d840231c54f1cc101
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^hugegraph/server@sha256:30f99c6b"
