suite: Server readiness path
tests:
  - it: reads all three Server probes from /versions by default
    template: server-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /versions
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /versions
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /versions

  - it: moves only the Server readiness probe when server.readinessPath targets /readiness
    template: server-deployment.yaml
    set:
      server.readinessPath: /readiness
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readiness
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /versions
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /versions
