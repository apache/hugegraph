suite: StatefulSet update and PVC retention hardening
templates:
  - pd-statefulset.yaml
  - store-statefulset.yaml
tests:
  - it: declares an explicit updateStrategy
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate

  - it: retains PVCs on delete and scale-down
    asserts:
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
          value: Retain
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Retain

  - it: uses Parallel pod management for raft bring-up
    asserts:
      - equal:
          path: spec.podManagementPolicy
          value: Parallel

  - it: honours an OnDelete updateStrategy override
    set:
      pd.updateStrategy.type: OnDelete
      store.updateStrategy.type: OnDelete
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
