# The install notes warn about chart-generated credentials under a
# template-only renderer. The rollout checksums hash the generated values,
# so such a renderer rolls the Pods on every sync; the warning must say so.
suite: Install notes
templates:
  - NOTES.txt
tests:
  - it: says a template-only render rolls the Pods on every sync
    asserts:
      - matchRegexRaw:
          pattern: "Chart-generated credentials are in use: pd.auth, server.auth.admin, server.auth.token"
      - matchRegexRaw:
          pattern: "every sync changes the\\s+Secret, rolls the Pods that read it"
      - notMatchRegexRaw:
          pattern: "without rolling"

  - it: omits the warning when every credential comes from an existing Secret
    set:
      pd.auth.existingSecret: byo-pd
      server.auth.admin.existingSecret: byo-admin
      server.auth.token.existingSecret: byo-token
    asserts:
      - notMatchRegexRaw:
          pattern: "Chart-generated credentials"
