suite: Experimental bootstrap bootstrap_legacy_test.yaml
templates:
- pd-statefulset.yaml
- store-statefulset.yaml
- server-deployment.yaml
- bootstrap-configmap.yaml
set:
  fullnameOverride: cluster
  bootstrap.enabled: true
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 4
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 3
release:
  upgrade: true
kubernetesProvider:
  scheme:
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    apps/v1/StatefulSet:
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: cluster-pd
      namespace: NAMESPACE
      labels: &id001
        app.kubernetes.io/name: hugegraph
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/component: pd
    spec:
      replicas: '3'
      volumeClaimTemplates:
      - metadata:
          name: pd-data
      selector:
        matchLabels: *id001
      template:
        spec:
          containers:
          - name: pd
            ports:
            - name: grpc
              containerPort: '8686'
            - name: rest
              containerPort: '8620'
            - name: raft
              containerPort: '8610'
            env:
            - name: HG_PD_RAFT_PEERS_LIST
              value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8610,cluster-pd-1.cluster-pd.NAMESPACE.svc:8610,cluster-pd-2.cluster-pd.NAMESPACE.svc:8610
            - name: HG_PD_INITIAL_STORE_LIST
              value: cluster-store-0.cluster-store.NAMESPACE.svc:8500,cluster-store-1.cluster-store.NAMESPACE.svc:8500,cluster-store-2.cluster-store.NAMESPACE.svc:8500,cluster-store-3.cluster-store.NAMESPACE.svc:8500
            - name: HG_PD_INITIAL_STORE_COUNT
              value: '3'
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: cluster-store
      namespace: NAMESPACE
      labels: &id002
        app.kubernetes.io/name: hugegraph
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/component: store
    spec:
      replicas: '4'
      volumeClaimTemplates:
      - metadata:
          name: store-data
      selector:
        matchLabels: *id002
      template:
        spec:
          containers:
          - name: store
            env:
            - name: HG_STORE_PD_ADDRESS
              value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8686,cluster-pd-1.cluster-pd.NAMESPACE.svc:8686,cluster-pd-2.cluster-pd.NAMESPACE.svc:8686
            ports:
            - name: grpc
              containerPort: '8500'
            - name: rest
              containerPort: '8520'
            - name: raft
              containerPort: '8510'
tests:
- it: retains PD bootstrap inputs
  template: pd-statefulset.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HG_PD_RAFT_PEERS_LIST
        value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8610,cluster-pd-1.cluster-pd.NAMESPACE.svc:8610,cluster-pd-2.cluster-pd.NAMESPACE.svc:8610
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HG_PD_INITIAL_STORE_LIST
        value: cluster-store-0.cluster-store.NAMESPACE.svc:8500,cluster-store-1.cluster-store.NAMESPACE.svc:8500,cluster-store-2.cluster-store.NAMESPACE.svc:8500,cluster-store-3.cluster-store.NAMESPACE.svc:8500
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HG_PD_INITIAL_STORE_COUNT
        value: '3'
- it: retains Store seeds and bootstrap wait quorum
  template: store-statefulset.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HG_STORE_PD_ADDRESS
        value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8686,cluster-pd-1.cluster-pd.NAMESPACE.svc:8686,cluster-pd-2.cluster-pd.NAMESPACE.svc:8686
  - matchRegex:
      path: spec.template.spec.initContainers[0].command[2]
      pattern: REQUIRED=2
  - matchRegex:
      path: spec.template.spec.initContainers[0].command[2]
      pattern: cluster-pd-0\.cluster-pd\.NAMESPACE\.svc:8620,cluster-pd-1\.cluster-pd\.NAMESPACE\.svc:8620,cluster-pd-2\.cluster-pd\.NAMESPACE\.svc:8620
- it: retains Server seeds
  template: server-deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HG_SERVER_PD_PEERS
        value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8686,cluster-pd-1.cluster-pd.NAMESPACE.svc:8686,cluster-pd-2.cluster-pd.NAMESPACE.svc:8686
- it: records the original topology
  template: bootstrap-configmap.yaml
  asserts:
  - equal:
      path: data.pdReplicas
      value: '3'
  - equal:
      path: data.storeReplicas
      value: '4'
  - equal:
      path: data.initialStoreCount
      value: '3'
- it: refuses a bootstrap pin that conflicts with history
  template: store-statefulset.yaml
  set:
    bootstrap.pdReplicas: 5
  asserts:
  - failedTemplate:
      errorPattern: bootstrap.pdReplicas cannot change
