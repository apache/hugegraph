# The credential contract is printable ASCII, no backslash, no leading or
# trailing space; the admin password also takes no colon and no space at
# all. The schema enforces it on inline values (schema aborts
# cannot be matched by this framework, so those cases live in the CI
# reject-invalid-values step); the container wrappers enforce it on an
# existingSecret, which is only seen at Pod start. These cases pin the
# wrapper checks and the hook contract, so a rewrite cannot silently drop
# them.
suite: Credential contract and test hook contract
tests:
  - it: checks the admin password byte-wise under the C locale in the Server wrapper
    template: server-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "LC_ALL=C tr -d"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "decodes Basic-auth credentials as ASCII"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "fix the server.auth.admin"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "must not contain a colon"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "\\*' '\\*\\)\\n[^\\n]*# Temporary"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "must not contain spaces"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "\\[\\[:print:\\]\\]"

  - it: skips the admin password check when authentication is disabled
    template: server-deployment.yaml
    set:
      server.auth.enabled: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "LC_ALL=C tr -d"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "must not contain spaces"

  - it: checks the PD REST secret byte-wise under the C locale in the Hubble wrapper
    template: hubble-deployment.yaml
    set:
      hubble.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "LC_ALL=C tr -d"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "fix the pd.auth"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "\\[\\[:print:\\]\\]"

  - it: carries no PD secret check in direct mode, which reads no PD secret
    template: hubble-deployment.yaml
    set:
      hubble.enabled: true
      hubble.mode: direct
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "LC_ALL=C tr -d"

  - it: keeps the succeeded test Pod so helm test --logs can read it
    template: tests/test-connection.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: sweeps every Pod on every attempt and counts one address family per Pod
    template: tests/test-connection.yaml
    asserts:
      - notMatchRegex:
          path: spec.containers[0].command[2]
          pattern: "PASSED"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "grep -v ':'"
