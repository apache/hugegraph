suite: Hubble Text2GQL master key stays on the data volume
tests:
  - it: points the Text2GQL master key at the data volume next to H2
    template: hubble-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_HUBBLE_TEXT2GQL_MASTER_KEY_FILE
            value: /hubble-data/text2gql-master.key
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "text2gql\\.shared\\.master_key_file=%s"

  - it: rejects overriding the chart-managed master key path through extraEnv
    set:
      hubble:
        extraEnv:
          - name: HG_HUBBLE_TEXT2GQL_MASTER_KEY_FILE
            value: /tmp/elsewhere.key
    asserts:
      - failedTemplate:
          errorPattern: "HG_HUBBLE_TEXT2GQL_MASTER_KEY_FILE"
