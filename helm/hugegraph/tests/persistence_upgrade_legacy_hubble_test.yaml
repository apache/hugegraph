suite: Legacy Hubble storage upgrade guard
templates:
  - server-deployment.yaml
kubernetesProvider:
  scheme:
    "apps/v1/StatefulSet":
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
    "apps/v1/Deployment":
      gvr:
        group: apps
        version: v1
        resource: deployments
      namespaced: true
  objects:
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: RELEASE-NAME-hugegraph-pd
        namespace: NAMESPACE
      spec:
        replicas: "3"
        volumeClaimTemplates:
          - metadata:
              name: pd-data
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: RELEASE-NAME-hugegraph-store
        namespace: NAMESPACE
      spec:
        replicas: "3"
        volumeClaimTemplates:
          - metadata:
              name: store-data
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: RELEASE-NAME-hugegraph-hubble
        namespace: NAMESPACE
      spec:
        template:
          spec:
            containers:
              - name: hubble
tests:
  - it: explains how to preserve the volume-less legacy storage mode
    release:
      upgrade: true
    asserts:
      - failedTemplate:
          errorPattern: "legacy Hubble has no data volume.*hubble.persistence.enabled=false.*--reuse-values"

  - it: accepts an explicit legacy temporary override despite global persistence
    release:
      upgrade: true
    set:
      hubble.persistence.enabled: false
    asserts:
      - isKind:
          of: Deployment

  - it: checks an explicit persistent override even when the global flag is false
    release:
      upgrade: true
    set:
      persistence.enabled: false
      pd.storage.enabled: true
      store.storage.enabled: true
      hubble.persistence.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "legacy Hubble has no data volume"

  - it: does not apply the legacy live guard to fresh installations
    release:
      upgrade: false
    asserts:
      - isKind:
          of: Deployment
