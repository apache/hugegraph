# A non-ClusterIP Server Service publishes the plain-HTTP Server API, and
# with it Basic-auth credentials and JWTs in cleartext, the same class of
# exposure the PD and Hubble Services and the TLS-less Ingresses already gate
# behind an explicit acknowledgement.
suite: Server Service exposure gate
templates:
  - server-deployment.yaml
  - server-service.yaml
tests:
  # validateValues is included from the Server Deployment, so the
  # rejections render that template.
  - it: rejects a NodePort Server Service without the acknowledgement
    template: server-deployment.yaml
    set:
      server.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "set server.service.allowInsecureExposure=true"

  - it: rejects a LoadBalancer Server Service without the acknowledgement
    template: server-deployment.yaml
    set:
      server.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "set server.service.allowInsecureExposure=true"

  - it: rejects it with authentication off too
    template: server-deployment.yaml
    set:
      server.auth.enabled: false
      server.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "set server.service.allowInsecureExposure=true"

  - it: renders a NodePort Server Service once acknowledged
    template: server-service.yaml
    set:
      server.service.type: NodePort
      server.service.allowInsecureExposure: true
      server.service.nodePort: 30080
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30080

  - it: keeps the default ClusterIP Service without the acknowledgement
    template: server-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
