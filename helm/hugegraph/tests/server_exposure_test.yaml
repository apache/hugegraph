suite: Server Service exposure and mode defaults
templates:
  - server-service.yaml
tests:
  - it: defaults to an automatic NodePort in easy mode
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - notExists:
          path: spec.ports[0].nodePort

  - it: defaults to ClusterIP in strict mode
    set:
      mode: strict
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: honors an explicit NodePort in strict mode without acknowledgement
    set:
      mode: strict
      server.service.type: NodePort
      server.service.nodePort: 8802
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 8802

  - it: renders LoadBalancer without acknowledgement
    set:
      server.service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: honors an explicit ClusterIP in easy mode
    set:
      server.service.type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: treats zero NodePort as automatic allocation
    set:
      server.service.nodePort: 0
    asserts:
      - notExists:
          path: spec.ports[0].nodePort
