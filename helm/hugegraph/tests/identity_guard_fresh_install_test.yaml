# The membership and identity guards read the live StatefulSets through
# lookup. These cases fake that object, so the refused path (a raft port
# change, a rename, a replica shrink) and the allowed path (an unchanged
# upgrade, a fresh install) are both pinned at render time. validateValues
# is included from the Server Deployment, so the refusals render that.
# The identity guards read the live StatefulSets; with none present (a
# fresh install, or any template-only render) every port and name is free.
suite: Raft identity guards on a fresh install
templates:
  - pd-statefulset.yaml
tests:
  - it: lets a fresh install choose any raft port and name
    set:
      pd.ports.raft: 8611
      fullnameOverride: fresh
    asserts:
      - equal:
          path: metadata.name
          value: fresh-pd
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 8611
