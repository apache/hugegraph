suite: Persistence upgrade guards from persistent storage
templates:
  - server-deployment.yaml
kubernetesProvider:
  scheme:
    "apps/v1/StatefulSet":
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
    "apps/v1/Deployment":
      gvr:
        group: apps
        version: v1
        resource: deployments
      namespaced: true
  objects:
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: RELEASE-NAME-hugegraph-pd
        namespace: NAMESPACE
      spec:
        replicas: "3"
        volumeClaimTemplates:
          - metadata:
              name: pd-data
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: RELEASE-NAME-hugegraph-store
        namespace: NAMESPACE
      spec:
        replicas: "3"
        volumeClaimTemplates:
          - metadata:
              name: store-data
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: RELEASE-NAME-hugegraph-hubble
        namespace: NAMESPACE
      spec:
        template:
          spec:
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: RELEASE-NAME-hugegraph-hubble-data
tests:
  - it: rejects changing pd away from persistent storage on upgrade
    release:
      upgrade: true
    set:
      persistence.enabled: true
      pd.storage.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "pd.storage.enabled cannot change on an initialized release"

  - it: rejects changing store away from persistent storage on upgrade
    release:
      upgrade: true
    set:
      persistence.enabled: true
      store.storage.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "store.storage.enabled cannot change on an initialized release"

  - it: rejects changing hubble away from persistent storage on upgrade
    release:
      upgrade: true
    set:
      persistence.enabled: true
      hubble.persistence.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "hubble.persistence.enabled cannot change on an initialized release"

  - it: accepts an unchanged persistent storage upgrade
    release:
      upgrade: true
    set:
      persistence.enabled: true
    asserts:
      - isKind:
          of: Deployment

  - it: fresh installation skips live storage migration checks
    release:
      upgrade: false
    set:
      persistence.enabled: false
    asserts:
      - isKind:
          of: Deployment

  - it: accepts changing runtime while keeping persistent storage
    release:
      upgrade: true
    set:
      global.runtimeVariant: topling
    asserts:
      - isKind:
          of: Deployment
