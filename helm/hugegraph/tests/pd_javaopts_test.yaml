suite: PD JAVA_OPTS derivation
templates:
  - pd-statefulset.yaml
tests:
  - it: disables the raft IP whitelist in-cluster by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_OPTS
            value: "-Dpartition.default-shard-count=3 -Draft.ip-whitelist.enabled=false"

  - it: re-enables the whitelist when the operator opts in
    set:
      pd.raftIpWhitelistEnabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="JAVA_OPTS")].value
          pattern: "-Draft\\.ip-whitelist\\.enabled=true"

  - it: derives shard count 1 when store replicas are below 3
    set:
      store.replicas: 1
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="JAVA_OPTS")].value
          pattern: "-Dpartition\\.default-shard-count=1"

  - it: appends operator javaOpts after the derived flags
    set:
      pd.javaOpts: "-Xmx2g"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="JAVA_OPTS")].value
          pattern: "-Draft\\.ip-whitelist\\.enabled=false -Xmx2g$"
