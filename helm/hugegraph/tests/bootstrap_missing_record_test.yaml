suite: Initialized bootstrap cannot lose its record
templates:
- store-statefulset.yaml
- bootstrap-configmap.yaml
set:
  fullnameOverride: cluster
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 3
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 2
  pd.partition.defaultShardCount: 3
release:
  upgrade: true
kubernetesProvider:
  scheme:
    v1/PersistentVolumeClaim:
      gvr:
        version: v1
        resource: persistentvolumeclaims
      namespaced: true
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    apps/v1/StatefulSet:
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: cluster-pd
      namespace: NAMESPACE
      annotations:
        hugegraph.apache.org/bootstrap-retained: 'true'
tests:
- it: rejects a missing record for the initialized release
  template: store-statefulset.yaml
  asserts:
  - failedTemplate:
      errorPattern: bootstrap record is missing from an initialized release
