suite: validateValues guard rails
templates:
  - server-deployment.yaml
tests:
  - it: rejects a PDB that would let PD drop below raft majority
    set:
      pd.pdb.minAvailable: 1
    asserts:
      - failedTemplate:
          errorPattern: "pd.pdb.minAvailable must be at least the PD Raft majority"

  - it: rejects a PDB that would permanently block drains
    set:
      pd.pdb.minAvailable: 3
    asserts:
      - failedTemplate:
          errorPattern: "must be less than pd.replicas"

  - it: rejects an even shard count
    set:
      pd.partition.defaultShardCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "must be odd"

  - it: rejects a shard count above store.replicas
    set:
      pd.partition.defaultShardCount: 5
    asserts:
      - failedTemplate:
          errorPattern: "greater than store.replicas"

  - it: rejects operator overrides of the chart-managed JAVA_OPTIONS
    set:
      server.extraEnv:
        - name: JAVA_OPTIONS
          value: "-Xmx1g"
    asserts:
      - failedTemplate:
          errorPattern: "must not set the chart-managed variable JAVA_OPTIONS"

  - it: rejects a PD NodePort under NetworkPolicy without pd extraIngress
    set:
      networkPolicy.enabled: true
      pd.service.type: NodePort
      pd.service.allowInsecureExposure: true
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the pd exposure"

  - it: rejects a PD LoadBalancer under NetworkPolicy without pd extraIngress
    set:
      networkPolicy.enabled: true
      pd.service.type: LoadBalancer
      pd.service.allowInsecureExposure: true
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the pd exposure"

  - it: rejects a Server NodePort under NetworkPolicy without server extraIngress
    set:
      networkPolicy.enabled: true
      server.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the server exposure"

  - it: rejects a Server LoadBalancer under NetworkPolicy without server extraIngress
    set:
      networkPolicy.enabled: true
      server.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the server exposure"

  - it: rejects a Server Ingress under NetworkPolicy without server extraIngress
    set:
      networkPolicy.enabled: true
      server.ingress.enabled: true
      server.ingress.allowPlainHttp: true
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the server exposure"

  - it: rejects a Server advertiseUrl under NetworkPolicy without server extraIngress
    set:
      networkPolicy.enabled: true
      server.advertiseUrl: http://hg.example.com:8080
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the server exposure"

  - it: rejects a Hubble NodePort under NetworkPolicy without hubble extraIngress
    set:
      networkPolicy.enabled: true
      hubble.enabled: true
      hubble.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the hubble exposure"

  - it: rejects a Hubble LoadBalancer under NetworkPolicy without hubble extraIngress
    set:
      networkPolicy.enabled: true
      hubble.enabled: true
      hubble.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the hubble exposure"

  - it: rejects a Hubble Ingress under NetworkPolicy without hubble extraIngress
    set:
      networkPolicy.enabled: true
      hubble.enabled: true
      hubble.ingress.enabled: true
      hubble.ingress.allowPlainHttp: true
    asserts:
      - failedTemplate:
          errorPattern: "admits nothing from outside the release, so the hubble exposure"

  - it: names advertiseUrl in the Server exposure message only
    set:
      networkPolicy.enabled: true
      server.advertiseUrl: http://hg.example.com:8080
    asserts:
      - failedTemplate:
          errorPattern: "server exposure \\(NodePort/LoadBalancer Service, Ingress, server.advertiseUrl\\)"

  - it: reports the PD acknowledgement before the NetworkPolicy exposure check
    set:
      networkPolicy.enabled: true
      pd.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "pd.service.allowInsecureExposure=true"

  - it: leaves exposure alone while NetworkPolicy is off
    set:
      server.service.type: LoadBalancer
      server.advertiseUrl: http://hg.example.com:8080
    asserts:
      - hasDocuments:
          count: 1

  - it: ignores Hubble exposure settings while Hubble is disabled
    set:
      networkPolicy.enabled: true
      hubble.service.type: NodePort
    asserts:
      - hasDocuments:
          count: 1

  - it: rejects Hubble without Server auth
    set:
      server.auth.enabled: false
      hubble.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "hubble.enabled requires server.auth"

  - it: rejects a plain-HTTP Hubble Ingress
    set:
      hubble.ingress.enabled: true
      hubble.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "publishes the plain-HTTP, unauthenticated Hubble UI"

  - it: rejects an empty Hubble image tag
    set:
      hubble.image.tag: ""
      hubble.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "hubble.image needs a tag or a digest"

  - it: rejects a Store PDB that permits two concurrent evictions
    set:
      store.replicas: 4
    asserts:
      - failedTemplate:
          errorPattern: "store.pdb.minAvailable must be at least store.replicas - 1"

  - it: rejects podLabels that overwrite a selector label
    set:
      store.podLabels:
        app.kubernetes.io/component: hacked
    asserts:
      - failedTemplate:
          errorPattern: "store.podLabels must not set app.kubernetes.io/component"

  - it: rejects a TLS-less Server Ingress without the plain-HTTP opt-in
    set:
      server.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "server.ingress.enabled without tls"

  - it: rejects a non-ClusterIP PD Service without the exposure acknowledgement
    set:
      pd.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "pd.service.type NodePort or LoadBalancer exposes"

  - it: rejects a read-only root filesystem on Hubble
    set:
      hubble.enabled: true
      hubble.securityContext.readOnlyRootFilesystem: true
    asserts:
      - failedTemplate:
          errorPattern: "readOnlyRootFilesystem=true breaks Hubble"

  - it: rejects a read-only root filesystem on Server
    set:
      server.securityContext.readOnlyRootFilesystem: true
    asserts:
      - failedTemplate:
          errorPattern: "readOnlyRootFilesystem=true breaks Server"

  - it: rejects a Server pod annotation under the chart-owned checksum prefix
    set:
      server.podAnnotations:
        checksum/auth: pinned
    asserts:
      - failedTemplate:
          errorPattern: "server.podAnnotations must not set checksum/auth"

  - it: rejects a PD pod annotation under the chart-owned checksum prefix
    set:
      pd.podAnnotations:
        checksum/pd-auth: pinned
    asserts:
      - failedTemplate:
          errorPattern: "pd.podAnnotations must not set checksum/pd-auth"
