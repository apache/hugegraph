suite: Helm test checks Gremlin on every Server Pod
templates:
  - tests/test-connection.yaml
  - server-service-headless.yaml
tests:
  - it: renders a headless Server Service for per-Pod enumeration
    template: server-service-headless.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - notExists:
          path: spec.publishNotReadyAddresses
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: server
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hugegraph-server-headless

  - it: keeps the headless name inside the DNS label limit under a long override
    template: server-service-headless.yaml
    set:
      fullnameOverride: an-extremely-long-fullname-override-that-hits-the-63-char-limit
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"

  - it: runs a graph-bound Gremlin check against the headless endpoints
    template: tests/test-connection.yaml
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "RELEASE-NAME-hugegraph-server-headless"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "/gremlin"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "DEFAULT-hugegraph"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "FLOOR=\"3\""

  - it: checks the explicitly selected graph in a non-default graph space
    template: tests/test-connection.yaml
    set:
      server.graphSpace: team_a
      server.testGraphAlias: team_a-demo
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: '"graph":"team_a-demo"'
      - notMatchRegex:
          path: spec.containers[0].command[2]
          pattern: "DEFAULT-hugegraph"

  - it: preserves the default binding when graphSpace changes without a selected graph
    template: tests/test-connection.yaml
    set:
      server.graphSpace: team_a
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: '"graph":"DEFAULT-hugegraph"'

  - it: preserves a static graph binding with an uppercase local file name
    template: tests/test-connection.yaml
    set:
      server.testGraphAlias: DEFAULT-Demo
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: '"graph":"DEFAULT-Demo"'

  - it: defaults a null alias for both index and business checks
    template: tests/test-connection.yaml
    set:
      server.testGraphAlias: null
      server.testGremlin: "assert graph.traversal().V().count().next() == 40"
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: '(?m)^\s*BODY=.*"graph":"DEFAULT-hugegraph"'
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: '(?m)^\s*BUSINESS_BODY=.*"graph":"DEFAULT-hugegraph"'

  - it: floors the per-Pod count at the HPA minimum when HPA is enabled
    template: tests/test-connection.yaml
    set:
      server.hpa.enabled: true
      server.hpa.minReplicas: 5
      server.resources.requests.cpu: 500m
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "FLOOR=\"5\""

  - it: checks linked indexes by ID without refreshing the full index cache
    template: tests/test-connection.yaml
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "getVertexLabels.*getEdgeLabels"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "graph.indexLabel"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "index.status.*ok"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "CREATED expected"
      - notMatchRegex:
          path: spec.containers[0].command[2]
          pattern: "getIndexLabels"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "business assertions skipped"

  - it: sends optional business assertions on each Pod
    template: tests/test-connection.yaml
    set:
      server.testGremlin: "assert graph.traversal().V().count().next() == 40"
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "assert graph.traversal"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "business assertion"

  - it: sends no credentials when authentication is disabled
    template: tests/test-connection.yaml
    set:
      hubble.enabled: false
      server.auth.enabled: false
    asserts:
      - notMatchRegex:
          path: spec.containers[0].command[2]
          pattern: "Authorization"
      - notExists:
          path: spec.containers[0].env
