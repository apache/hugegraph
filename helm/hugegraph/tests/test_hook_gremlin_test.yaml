suite: Helm test checks Gremlin on every Server Pod
templates:
  - tests/test-connection.yaml
  - server-service-headless.yaml
tests:
  - it: renders a headless Server Service for per-Pod enumeration
    template: server-service-headless.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - notExists:
          path: spec.publishNotReadyAddresses
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: server
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hugegraph-server-headless

  - it: keeps the headless name inside the DNS label limit under a long override
    template: server-service-headless.yaml
    set:
      fullnameOverride: an-extremely-long-fullname-override-that-hits-the-63-char-limit
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"

  - it: runs a graph-bound Gremlin check against the headless endpoints
    template: tests/test-connection.yaml
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "RELEASE-NAME-hugegraph-server-headless"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "/gremlin"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "DEFAULT-hugegraph"
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "FLOOR=\"3\""

  - it: floors the per-Pod count at the HPA minimum when HPA is enabled
    template: tests/test-connection.yaml
    set:
      server.hpa.enabled: true
      server.hpa.minReplicas: 5
      server.resources.requests.cpu: 500m
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: "FLOOR=\"5\""

  - it: sends no credentials when authentication is disabled
    template: tests/test-connection.yaml
    set:
      server.auth.enabled: false
    asserts:
      - notMatchRegex:
          path: spec.containers[0].command[2]
          pattern: "Authorization"
      - notExists:
          path: spec.containers[0].env
