suite: Retained records do not authorize orphaned PVC recovery
templates:
- bootstrap-configmap.yaml
- pd-statefulset.yaml
set:
  fullnameOverride: cluster
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 3
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 2
release:
  upgrade: true
kubernetesProvider:
  scheme:
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    v1/PersistentVolumeClaim:
      gvr:
        version: v1
        resource: persistentvolumeclaims
      namespaced: true
    apps/v1/StatefulSet:
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-bootstrap
      namespace: NAMESPACE
      labels:
        app.kubernetes.io/instance: RELEASE-NAME
    data:
      schemaVersion: '1'
      pdReplicas: '3'
      storeReplicas: '3'
      initialStoreCount: '3'
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: store-data-cluster-store-0
      namespace: NAMESPACE
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: unrelated-pd
      namespace: NAMESPACE
      labels:
        app.kubernetes.io/instance: unrelated
        app.kubernetes.io/component: pd
    spec:
      replicas: '1'
tests:
- it: rejects a retained volume despite matching bootstrap counts
  template: pd-statefulset.yaml
  asserts:
  - failedTemplate:
      errorPattern: retained data PVCs exist without a live PD StatefulSet
