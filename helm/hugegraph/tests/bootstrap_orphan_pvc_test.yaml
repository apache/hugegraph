suite: Retained data PVCs require reviewed recovery
templates:
- bootstrap-configmap.yaml
set:
  fullnameOverride: cluster
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 3
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 2
  pd.partition.defaultShardCount: 3
kubernetesProvider:
  scheme:
    v1/PersistentVolumeClaim:
      gvr:
        version: v1
        resource: persistentvolumeclaims
      namespaced: true
  objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: store-data-cluster-store-0
      namespace: NAMESPACE
tests:
- it: rejects a fresh install over retained data without a live PD
  asserts:
  - failedTemplate:
      errorPattern: retained data PVCs exist without a live PD StatefulSet
