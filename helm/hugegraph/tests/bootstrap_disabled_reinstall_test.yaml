suite: Bootstrap reinstall checks depend on enabled mode
templates:
- pd-statefulset.yaml
set:
  fullnameOverride: cluster
  bootstrap.enabled: false
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 5
  pd.pdb.minAvailable: 3
kubernetesProvider:
  scheme:
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
  objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-bootstrap
      namespace: NAMESPACE
      labels:
        app.kubernetes.io/instance: RELEASE-NAME
    data:
      schemaVersion: '1'
      pdReplicas: '3'
      storeReplicas: '3'
      initialStoreCount: '3'
tests:
- it: leaves orphaned history unchecked when bootstrap is disabled
  asserts:
  - equal:
      path: spec.replicas
      value: 5
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: HG_PD_RAFT_PEERS_LIST
        value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8610,cluster-pd-1.cluster-pd.NAMESPACE.svc:8610,cluster-pd-2.cluster-pd.NAMESPACE.svc:8610,cluster-pd-3.cluster-pd.NAMESPACE.svc:8610,cluster-pd-4.cluster-pd.NAMESPACE.svc:8610
- it: refuses an orphaned record when bootstrap is enabled
  set:
    bootstrap.enabled: true
  asserts:
  - failedTemplate:
      errorPattern: bootstrap history already exists on an install
