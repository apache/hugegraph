suite: Server startup timeout tracks the startup probe budget
templates:
  - server-deployment.yaml
tests:
  - it: passes the derived 150 second start budget to the image
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "150"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 91
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5

  - it: follows a raised startup probe budget on the guaranteed timeline
    set:
      server.probes.startup.failureThreshold: 200
      server.probes.startup.periodSeconds: 10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "1690"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 200

  - it: follows the 450 second probe floor when a lower failureThreshold is configured
    set:
      server.probes.startup.failureThreshold: 1
      server.probes.startup.periodSeconds: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "150"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 91

  - it: holds the floor when the period is large and the threshold low
    set:
      server.probes.startup.failureThreshold: 1
      server.probes.startup.periodSeconds: 300
    asserts:
      # First probe can fail at t=0, so 3 failures guarantee (3-1)*300=600s
      # alive; the image gets 600-300=300s, inside the guaranteed window.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "300"

  - it: needs two failures even when one period covers the whole floor
    set:
      server.probes.startup.failureThreshold: 1
      server.probes.startup.periodSeconds: 450
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "150"

  - it: rounds the floor up when the period does not divide it
    set:
      server.probes.startup.failureThreshold: 1
      server.probes.startup.periodSeconds: 449
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "598"

  - it: leaves an initialDelay to lengthen the timeline without shrinking budgets
    set:
      server.probes.startup.initialDelaySeconds: 600
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 600
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 91
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "150"

  - it: caps at the entrypoint's 86400 second maximum
    set:
      server.probes.startup.failureThreshold: 100000
      server.probes.startup.periodSeconds: 10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "86400"

  - it: refuses an extraEnv override that would silently diverge from the probe
    set:
      server.extraEnv:
        - name: HG_SERVER_STARTUP_TIMEOUT_S
          value: "60"
    asserts:
      - failedTemplate:
          errorMessage: server.extraEnv must not set the chart-managed variable HG_SERVER_STARTUP_TIMEOUT_S
