suite: Server startup timeout tracks the startup probe budget
templates:
  - server-deployment.yaml
tests:
  - it: passes the default 450 second budget to the image
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "450"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 90
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5

  - it: follows a raised startup probe budget
    set:
      server.probes.startup.failureThreshold: 200
      server.probes.startup.periodSeconds: 10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "2000"

  - it: follows the 450 second floor when a lower failureThreshold is configured
    set:
      server.probes.startup.failureThreshold: 1
      server.probes.startup.periodSeconds: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "450"

  - it: caps at the entrypoint's 86400 second maximum
    set:
      server.probes.startup.failureThreshold: 100000
      server.probes.startup.periodSeconds: 10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HG_SERVER_STARTUP_TIMEOUT_S
            value: "86400"

  - it: refuses an extraEnv override that would silently diverge from the probe
    set:
      server.extraEnv:
        - name: HG_SERVER_STARTUP_TIMEOUT_S
          value: "60"
    asserts:
      - failedTemplate:
          errorMessage: server.extraEnv must not set the chart-managed variable HG_SERVER_STARTUP_TIMEOUT_S
