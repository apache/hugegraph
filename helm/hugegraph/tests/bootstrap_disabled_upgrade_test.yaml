suite: Disabled bootstrap keeps the default upgrade path free of ConfigMap reads
templates:
- pd-statefulset.yaml
set:
  fullnameOverride: cluster
  bootstrap.enabled: false
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 3
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 2
release:
  upgrade: true
kubernetesProvider:
  scheme:
    apps/v1/StatefulSet:
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: cluster-pd
      namespace: NAMESPACE
      labels:
        app.kubernetes.io/name: hugegraph
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/component: pd
    spec:
      template:
        spec:
          containers:
          - name: pd
            env:
            - name: HG_PD_RAFT_PEERS_LIST
              value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8610,cluster-pd-1.cluster-pd.NAMESPACE.svc:8610,cluster-pd-2.cluster-pd.NAMESPACE.svc:8610
tests:
- it: renders without a ConfigMap lookup when bootstrap stays disabled
  template: pd-statefulset.yaml
  asserts:
  - equal:
      path: spec.replicas
      value: 3
