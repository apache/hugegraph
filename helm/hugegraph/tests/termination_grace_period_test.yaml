suite: Workload termination grace period overrides
templates:
  - pd-statefulset.yaml
  - store-statefulset.yaml
  - server-deployment.yaml
  - hubble-deployment.yaml
tests:
  - it: preserves explicit zero grace periods
    set:
      hubble.enabled: true
      pd.terminationGracePeriodSeconds: 0
      store.terminationGracePeriodSeconds: 0
      server.terminationGracePeriodSeconds: 0
      hubble.terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
