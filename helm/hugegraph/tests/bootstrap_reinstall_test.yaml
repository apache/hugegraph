suite: Experimental bootstrap refuses implicit recovery
templates:
- pd-statefulset.yaml
- store-statefulset.yaml
- server-deployment.yaml
- bootstrap-configmap.yaml
set:
  fullnameOverride: cluster
  bootstrap.enabled: true
  pd.auth.existingSecret: fixture-pd
  server.auth.admin.existingSecret: fixture-admin
  server.auth.token.existingSecret: fixture-token
  pd.replicas: 3
  store.replicas: 4
  pd.pdb.minAvailable: 2
  store.pdb.minAvailable: 3
kubernetesProvider:
  scheme:
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    apps/v1/StatefulSet:
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-bootstrap
      namespace: NAMESPACE
    data:
      schemaVersion: '1'
      pdReplicas: '3'
      storeReplicas: '3'
      initialStoreCount: '3'
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: cluster-pd
      namespace: NAMESPACE
      labels: &id001
        app.kubernetes.io/name: hugegraph
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/component: pd
    spec:
      replicas: '3'
      volumeClaimTemplates:
      - metadata:
          name: pd-data
      selector:
        matchLabels: *id001
      template:
        spec:
          containers:
          - name: pd
            ports:
            - name: grpc
              containerPort: '8686'
            - name: rest
              containerPort: '8620'
            - name: raft
              containerPort: '8610'
            env:
            - name: HG_PD_RAFT_PEERS_LIST
              value: cluster-pd-0.cluster-pd.NAMESPACE.svc:8610,cluster-pd-1.cluster-pd.NAMESPACE.svc:8610,cluster-pd-2.cluster-pd.NAMESPACE.svc:8610
            - name: HG_PD_INITIAL_STORE_LIST
              value: cluster-store-0.cluster-store.NAMESPACE.svc:8500,cluster-store-1.cluster-store.NAMESPACE.svc:8500,cluster-store-2.cluster-store.NAMESPACE.svc:8500
            - name: HG_PD_INITIAL_STORE_COUNT
              value: '3'
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: cluster-store
      namespace: NAMESPACE
      labels: &id002
        app.kubernetes.io/name: hugegraph
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/component: store
    spec:
      replicas: '4'
      volumeClaimTemplates:
      - metadata:
          name: store-data
      selector:
        matchLabels: *id002
      template:
        spec:
          containers:
          - name: store
            ports:
            - name: grpc
              containerPort: '8500'
            - name: rest
              containerPort: '8520'
            - name: raft
              containerPort: '8510'
tests:
- it: refuses treating retained topology as a fresh install
  template: store-statefulset.yaml
  set:
    pd.replicas: 5
    pd.pdb.minAvailable: 3
  asserts:
  - failedTemplate:
      errorPattern: bootstrap history already exists on an install
