# Label values must stay strings. An all-digit release name or a nameOverride
# such as "true" would otherwise render as a YAML number or boolean, and the
# API rejects a label map that is not map[string]string.
suite: Selector label values render as strings
templates:
  - server-deployment.yaml
  - pd-statefulset.yaml
tests:
  - it: quotes an all-digit release name
    release:
      name: "123"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "123"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: "123"

  - it: quotes a boolean-looking nameOverride
    set:
      nameOverride: "true"
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: "true"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: "true"
