suite: Retained Topling volumes on runtime upgrades
templates:
  - pd-statefulset.yaml
  - store-statefulset.yaml
kubernetesProvider:
  scheme:
    "apps/v1/StatefulSet":
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: RELEASE-NAME-hugegraph-pd
        namespace: NAMESPACE
        annotations:
          hugegraph.apache.org/rocksdb-runtime: topling
      spec:
        replicas: "3"
        volumeClaimTemplates:
          - metadata:
              name: pd-data
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: RELEASE-NAME-hugegraph-store
        namespace: NAMESPACE
        annotations:
          hugegraph.apache.org/rocksdb-runtime: topling
      spec:
        replicas: "3"
        volumeClaimTemplates:
          - metadata:
              name: store-data
tests:
  - it: returns PD to RocksDB with the same persistent volume and rollout settings
    template: pd-statefulset.yaml
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hugegraph-pd
      - equal:
          path: spec.template.spec.containers[0].image
          value: hugegraph/pd:latest
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: pd-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: pd-data
            mountPath: /hugegraph-pd/pd_data
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300

  - it: returns Store to RocksDB with the same persistent volume
    template: store-statefulset.yaml
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hugegraph-store
      - equal:
          path: spec.template.spec.containers[0].image
          value: hugegraph/store:latest
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: store-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: store-data
            mountPath: /hugegraph-store/storage
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate

  - it: accepts an unchanged persistent Topling upgrade
    release:
      upgrade: true
    set:
      global.runtimeVariant: topling
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.annotations["hugegraph.apache.org/rocksdb-runtime"]
          value: topling
