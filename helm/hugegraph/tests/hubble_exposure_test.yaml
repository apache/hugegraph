# A non-ClusterIP Hubble Service publishes the plain-HTTP UI directly, the
# same class of exposure the PD Service and the TLS-less Ingresses already
# gate behind an explicit acknowledgement.
suite: Hubble Service exposure gate
templates:
  - server-deployment.yaml
  - hubble-service.yaml
tests:
  # validateValues is included from the Server Deployment, so the
  # rejections render that template.
  - it: rejects a NodePort Hubble Service without the acknowledgement
    template: server-deployment.yaml
    set:
      hubble.enabled: true
      hubble.service.type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "set hubble.service.allowInsecureExposure=true"

  - it: rejects a LoadBalancer Hubble Service without the acknowledgement
    template: server-deployment.yaml
    set:
      hubble.enabled: true
      hubble.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "set hubble.service.allowInsecureExposure=true"

  - it: renders a NodePort Hubble Service once acknowledged
    template: hubble-service.yaml
    set:
      hubble.enabled: true
      hubble.service.type: NodePort
      hubble.service.allowInsecureExposure: true
      hubble.service.nodePort: 30088
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30088

  - it: leaves the default ClusterIP Service alone
    template: hubble-service.yaml
    set:
      hubble.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
