suite: Optional RAG component
tests:
  - it: renders no RAG deployment while the component is disabled
    template: rag-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: connects an enabled RAG pod to the same-release Server service
    template: rag-deployment.yaml
    set:
      rag.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: hugegraph/rag:latest
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - python
            - -m
            - hugegraph_llm.demo.rag_demo.app
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --host
            - 0.0.0.0
            - --port
            - "8001"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8001
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_URL
            value: RELEASE-NAME-hugegraph-server.NAMESPACE.svc:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_PWD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-admin
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUGEGRAPH_LLM_ENV_PATH
            value: /tmp/hugegraph-llm.env

  - it: passes a custom port to the process and Pod contract
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.port: 9001
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: "9001"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9001

  - it: lets an explicit graph endpoint and Secret replace release wiring
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.hugegraph.url: http://remote.graphs.svc:8080
      rag.hugegraph.passwordSecret.name: remote-admin
      rag.hugegraph.passwordSecret.key: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_URL
            value: http://remote.graphs.svc:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_PWD
            valueFrom:
              secretKeyRef:
                name: remote-admin
                key: credential

  - it: uses the topology preset replica count without changing the template
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: seeds image resources before mounting persistent storage
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.persistence.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: seed-resources
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "cp -a -n"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /home/work/hugegraph-llm/src/hugegraph_llm/resources

  - it: keeps the RAG service internal by default in easy mode
    template: rag-service.yaml
    set:
      rag.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8001
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - notExists:
          path: spec.ports[0].nodePort

  - it: keeps the RAG service internal by default in strict mode
    template: rag-service.yaml
    set:
      mode: strict
      rag.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: permits an explicit NodePort exposure
    template: rag-service.yaml
    set:
      rag.enabled: true
      rag.service.type: NodePort
      rag.service.nodePort: 31001
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 31001

  - it: creates a retained claim only when persistence is enabled
    template: rag-pvc.yaml
    set:
      rag.enabled: true
      rag.persistence.enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
