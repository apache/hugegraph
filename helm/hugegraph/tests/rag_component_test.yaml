suite: Optional RAG component
tests:
  - it: renders no RAG deployment while the component is disabled
    template: rag-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: connects one persistent non-root RAG pod to the same-release Server
    template: rag-deployment.yaml
    set:
      rag.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.containers[0].image
          value: hugegraph/rag:latest
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - python
            - -m
            - hugegraph_llm.demo.rag_demo.app
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--host", "0.0.0.0", "--port", "8001"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8001
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/hugegraph-rag
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_URL
            value: http://RELEASE-NAME-hugegraph-server.NAMESPACE.svc:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_PWD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-admin
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUGEGRAPH_LLM_ENV_PATH
            value: /var/lib/hugegraph-rag/.env
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUGEGRAPH_LLM_PROMPT_CONFIG_PATH
            value: /var/lib/hugegraph-rag/demo/config_prompt.yaml

  - it: passes a custom port to the process and Pod contract
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.port: 9001
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: "9001"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9001

  - it: lets an explicit graph endpoint and Secret replace release wiring
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.hugegraph.url: http://remote.graphs.svc:8080
      rag.hugegraph.passwordSecret.name: remote-admin
      rag.hugegraph.passwordSecret.key: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_URL
            value: http://remote.graphs.svc:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_PWD
            valueFrom:
              secretKeyRef:
                name: remote-admin
                key: credential

  - it: defaults a custom password Secret to the password key
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.hugegraph.passwordSecret.name: rag-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAPH_PWD
            valueFrom:
              secretKeyRef:
                name: rag-credentials
                key: password

  - it: supports an explicitly disposable RAG pod without creating overlap
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.persistence.enabled: false
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUGEGRAPH_LLM_ENV_PATH
            value: /tmp/hugegraph-llm.env

  - it: supports platform-assigned non-root IDs
    template: rag-deployment.yaml
    set:
      rag.enabled: true
      rag.podSecurityContext.runAsUser: auto
      rag.podSecurityContext.runAsGroup: auto
      rag.podSecurityContext.fsGroup: auto
      rag.securityContext.runAsUser: auto
      rag.securityContext.runAsGroup: auto
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.securityContext.runAsUser
      - notExists:
          path: spec.template.spec.securityContext.runAsGroup
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - notExists:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsGroup

  - it: keeps the RAG service internal by default in easy mode
    template: rag-service.yaml
    set:
      rag.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8001
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - notExists:
          path: spec.ports[0].nodePort

  - it: keeps the RAG service internal by default in strict mode
    template: rag-service.yaml
    set:
      mode: strict
      rag.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: permits an explicit NodePort exposure
    template: rag-service.yaml
    set:
      rag.enabled: true
      rag.service.type: NodePort
      rag.service.nodePort: 31001
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 31001

  - it: creates a retained claim by default after RAG is enabled
    template: rag-pvc.yaml
    set:
      rag.enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce

  - it: creates no claim when RAG persistence is explicitly disabled
    template: rag-pvc.yaml
    set:
      rag.enabled: true
      rag.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: inherits the global persistence disable when RAG does not override it
    template: rag-pvc.yaml
    set:
      rag.enabled: true
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
