{{- if get (get .Values "hubble" | default dict) "enabled" | default false }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugegraph.hubble.name" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: hubble
  {{- $svc := get .Values.hubble "service" | default dict }}
  {{- with (get $svc "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ get $svc "type" | default "ClusterIP" }}
  selector:
    {{- include "hugegraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hubble
  ports:
    - name: http
      port: {{ .Values.hubble.port }}
      targetPort: http
      {{- with (get $svc "nodePort") }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
