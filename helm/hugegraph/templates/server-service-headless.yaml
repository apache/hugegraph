# Headless Service enumerating the individual Server Pods. The helm test
# hook resolves it to run its graph-bound Gremlin check against every Pod
# (a broken-binding Pod passes readiness, so it appears here), and the
# per-Pod troubleshooting steps in the README can use it too.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugegraph.server.headlessName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  # Deliberately not publishNotReadyAddresses: the checks want exactly the
  # Pods the client Service routes to.
  selector:
    {{- include "hugegraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
