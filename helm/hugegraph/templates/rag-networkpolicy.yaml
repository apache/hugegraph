{{ include "hugegraph.resolveValues" . }}
{{- $rag := get .Values "rag" | default dict }}
{{- $networkPolicy := get .Values "networkPolicy" | default dict }}
{{- if and (get $rag "enabled" | default false) (get $networkPolicy "enabled" | default false) }}
{{- include "hugegraph.rag.validate" . }}
{{- $graph := get $rag "hugegraph" | default dict }}
{{- $autoConfigure := true }}
{{- if hasKey $graph "autoConfigure" }}{{- $autoConfigure = get $graph "autoConfigure" }}{{- end }}
{{- $envNames := dict }}
{{- range get $rag "env" | default list }}
{{- $_ := set $envNames (.name | toString) true }}
{{- end }}
{{- $internalServer := and $autoConfigure (not (trim (get $graph "url" | default ""))) (not (hasKey $envNames "GRAPH_URL")) }}
{{- $ragPolicy := get $rag "networkPolicy" | default dict }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hugegraph.rag.name" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
spec:
  podSelector:
    matchLabels:
      {{- include "hugegraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rag
  policyTypes:
    - Ingress
    - Egress
  {{- with get $ragPolicy "extraIngress" }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  egress:
    {{- if $internalServer }}
    - to:
        {{- include "hugegraph.netpol.peer" (dict "root" . "component" "server") | nindent 8 }}
      ports:
        {{- include "hugegraph.netpol.ports" (list .Values.server.port) | nindent 8 }}
    {{- end }}
    {{- include "hugegraph.netpol.dns" . | nindent 4 }}
    {{- with get $ragPolicy "extraEgress" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if $internalServer }}
---
# Core Server policy is intentionally kept independent from optional RAG.
# Kubernetes unions ingress allows from all policies selecting the same Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hugegraph.rag.name" . }}-to-server
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
spec:
  podSelector:
    matchLabels:
      {{- include "hugegraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "hugegraph.netpol.peer" (dict "root" . "component" "rag") | nindent 8 }}
      ports:
        {{- include "hugegraph.netpol.ports" (list .Values.server.port) | nindent 8 }}
{{- end }}
{{- end }}
