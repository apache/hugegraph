{{ include "hugegraph.resolveValues" . }}
{{- $rag := get .Values "rag" | default dict }}
{{- if get $rag "enabled" | default false }}
{{- include "hugegraph.rag.validate" . }}
{{- $graph := get $rag "hugegraph" | default dict }}
{{- $autoConfigure := true }}
{{- if hasKey $graph "autoConfigure" }}{{- $autoConfigure = get $graph "autoConfigure" }}{{- end }}
{{- $persistenceEnabled := eq (include "hugegraph.rag.persistenceEnabled" .) "true" }}
{{- $envNames := dict }}
{{- range get $rag "env" | default list }}
{{- $_ := set $envNames (.name | toString) true }}
{{- end }}
{{- $password := get $graph "passwordSecret" | default dict }}
{{- $explicitPasswordSecret := trim (get $password "name" | default "") }}
{{- $passwordSecret := include "hugegraph.rag.passwordSecretName" . }}
{{- $injectPassword := and $autoConfigure $passwordSecret (not (hasKey $envNames "GRAPH_PWD")) (or $explicitPasswordSecret (not (hasKey $envNames "GRAPH_URL"))) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hugegraph.rag.name" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
spec:
  replicas: {{ include "hugegraph.rag.replicas" . | int }}
  # The application keeps mutable runtime configuration in-process. Recreate
  # preserves the chart's single-active-pod contract even when persistence is off.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hugegraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rag
  template:
    metadata:
      labels:
        {{- include "hugegraph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rag
        {{- with get $rag "podLabels" }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- if or $injectPassword (get $rag "podAnnotations") }}
      annotations:
        {{- if $injectPassword }}
        {{- if $explicitPasswordSecret }}
        {{- $live := lookup "v1" "Secret" .Release.Namespace $passwordSecret | default dict }}
        checksum/hugegraph-auth: {{ printf "%s|%s|%s" $passwordSecret (include "hugegraph.rag.passwordSecretKey" .) (dig "metadata" "resourceVersion" "" $live) | sha256sum | quote }}
        {{- else }}
        checksum/hugegraph-auth: {{ include "hugegraph.server.authChecksum" . | quote }}
        {{- end }}
        {{- end }}
        {{- with get $rag "podAnnotations" }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- end }}
    spec:
      {{- $serviceAccount := get $rag "serviceAccount" | default dict }}
      {{- $serviceAccountCreate := true }}
      {{- if hasKey $serviceAccount "create" }}{{- $serviceAccountCreate = get $serviceAccount "create" }}{{- end }}
      automountServiceAccountToken: {{ get $serviceAccount "automountServiceAccountToken" | default false }}
      {{- if get $serviceAccount "name" | default "" }}
      serviceAccountName: {{ get $serviceAccount "name" }}
      {{- else if $serviceAccountCreate }}
      serviceAccountName: {{ include "hugegraph.rag.name" . }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      {{- if hasKey $rag "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ get $rag "terminationGracePeriodSeconds" }}
      {{- end }}
      {{- with get $rag "priorityClassName" }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with get $rag "nodeSelector" }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with get $rag "tolerations" }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with get $rag "topologySpreadConstraints" }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with get $rag "affinity" }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "hugegraph.rag.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $persistenceEnabled }}
      initContainers:
        - name: seed-resources
          image: {{ include "hugegraph.rag.image" . | quote }}
          imagePullPolicy: {{ get (get $rag "image" | default dict) "pullPolicy" | default "Always" }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # Preserve operator and UI edits. Image upgrades add only files
              # that are still missing from the persistent resource directory.
              # Recursive copy deliberately avoids archive-mode metadata writes
              # against a CSI volume root that remains owned by root.
              umask 007
              cp -R -n /home/work/hugegraph-llm/src/hugegraph_llm/resources/. /data/
          securityContext:
            {{- include "hugegraph.rag.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml (get $rag "initResources" | default dict) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: rag
          image: {{ include "hugegraph.rag.image" . | quote }}
          imagePullPolicy: {{ get (get $rag "image" | default dict) "pullPolicy" | default "Always" }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # HugeGraph AI loads an existing .env into os.environ before
              # Pydantic reads settings. Remove values owned by the current Pod,
              # by chart graph wiring, or by known upstream provider aliases.
              # Unrelated UI/operator edits remain persistent.
              umask 007
              python - <<'PY'
              import os
              from pathlib import Path

              from dotenv import dotenv_values, unset_key

              env_path_value = os.environ.get("HUGEGRAPH_LLM_ENV_PATH")
              if not env_path_value or not env_path_value.strip():
                  raise SystemExit("HUGEGRAPH_LLM_ENV_PATH must not be empty")
              env_path = Path(env_path_value)
              env_path.parent.mkdir(parents=True, exist_ok=True)
              env_path.touch(exist_ok=True)

              managed_keys = set()
              if "{{ $autoConfigure }}" == "true":
                  # autoConfigure owns the complete graph connection, including
                  # an intentionally absent password after switching endpoints.
                  managed_keys.update({
                      "GRAPH_URL",
                      "GRAPH_NAME",
                      "GRAPH_SPACE",
                      "GRAPH_USER",
                      "GRAPH_PWD",
                  })

              # HugeGraph AI derives these field-specific settings from the
              # generic environment variables, then may persist the derived
              # fields. Remove stale derivatives when the generic source is
              # currently declarative so rotations take effect on restart.
              derived_keys = {
                  "OPENAI_API_KEY": {
                      "OPENAI_CHAT_API_KEY",
                      "OPENAI_EXTRACT_API_KEY",
                      "OPENAI_TEXT2GQL_API_KEY",
                  },
                  "OPENAI_BASE_URL": {
                      "OPENAI_CHAT_API_BASE",
                      "OPENAI_EXTRACT_API_BASE",
                      "OPENAI_TEXT2GQL_API_BASE",
                  },
                  "OPENAI_EMBEDDING_BASE_URL": {
                      "OPENAI_EMBEDDING_API_BASE",
                  },
                  "CO_API_URL": {
                      "COHERE_BASE_URL",
                  },
              }
              for source, aliases in derived_keys.items():
                  if source in os.environ:
                      managed_keys.update(aliases)

              for key in dotenv_values(env_path):
                  if key in os.environ or key in managed_keys:
                      unset_key(str(env_path), key)
              PY
              exec python -m hugegraph_llm.demo.rag_demo.app \
                --host 0.0.0.0 --port {{ include "hugegraph.rag.port" . | int | quote }}
          securityContext:
            {{- include "hugegraph.rag.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ include "hugegraph.rag.port" . | int }}
              protocol: TCP
          env:
            {{- if and $autoConfigure (not (hasKey $envNames "GRAPH_URL")) }}
            - name: GRAPH_URL
              value: {{ include "hugegraph.rag.graphUrl" . | quote }}
            {{- end }}
            {{- if and $autoConfigure (not (hasKey $envNames "GRAPH_NAME")) }}
            - name: GRAPH_NAME
              value: {{ get $graph "graphName" | default "hugegraph" | quote }}
            {{- end }}
            {{- if and $autoConfigure (not (hasKey $envNames "GRAPH_SPACE")) }}
            - name: GRAPH_SPACE
              value: {{ include "hugegraph.rag.graphSpace" . | quote }}
            {{- end }}
            {{- if and $autoConfigure (not (hasKey $envNames "GRAPH_USER")) }}
            - name: GRAPH_USER
              value: {{ get $graph "username" | default "admin" | quote }}
            {{- end }}
            {{- if $injectPassword }}
            - name: GRAPH_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ $passwordSecret | quote }}
                  key: {{ include "hugegraph.rag.passwordSecretKey" . | quote }}
            {{- end }}
            {{- if not (hasKey $envNames "HUGEGRAPH_LLM_ENV_PATH") }}
            - name: HUGEGRAPH_LLM_ENV_PATH
              value: {{ include "hugegraph.rag.envPath" . | quote }}
            {{- end }}
            {{- if not (hasKey $envNames "HUGEGRAPH_LLM_PROMPT_CONFIG_PATH") }}
            - name: HUGEGRAPH_LLM_PROMPT_CONFIG_PATH
              value: {{ include "hugegraph.rag.promptConfigPath" . | quote }}
            {{- end }}
            {{- with get $rag "env" }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with get $rag "envFrom" }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (get $rag "resources" | default dict) | nindent 12 }}
          {{- if or $persistenceEnabled (get $rag "extraVolumeMounts") }}
          volumeMounts:
            {{- if $persistenceEnabled }}
            - name: data
              mountPath: {{ include "hugegraph.rag.mountPath" . | quote }}
            {{- end }}
            {{- with get $rag "extraVolumeMounts" }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ get (get (get $rag "probes" | default dict) "startup" | default dict) "path" | default "/" | quote }}
              port: http
            failureThreshold: {{ get (get (get $rag "probes" | default dict) "startup" | default dict) "failureThreshold" | default 60 }}
            periodSeconds: {{ get (get (get $rag "probes" | default dict) "startup" | default dict) "periodSeconds" | default 5 }}
            {{- include "hugegraph.probeTuning" (get (get $rag "probes" | default dict) "startup" | default dict) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ get (get (get $rag "probes" | default dict) "readiness" | default dict) "path" | default "/" | quote }}
              port: http
            failureThreshold: {{ get (get (get $rag "probes" | default dict) "readiness" | default dict) "failureThreshold" | default 3 }}
            periodSeconds: {{ get (get (get $rag "probes" | default dict) "readiness" | default dict) "periodSeconds" | default 10 }}
            {{- include "hugegraph.probeTuning" (get (get $rag "probes" | default dict) "readiness" | default dict) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ get (get (get $rag "probes" | default dict) "liveness" | default dict) "path" | default "/" | quote }}
              port: http
            failureThreshold: {{ get (get (get $rag "probes" | default dict) "liveness" | default dict) "failureThreshold" | default 3 }}
            periodSeconds: {{ get (get (get $rag "probes" | default dict) "liveness" | default dict) "periodSeconds" | default 20 }}
            {{- include "hugegraph.probeTuning" (get (get $rag "probes" | default dict) "liveness" | default dict) | nindent 12 }}
      {{- if or $persistenceEnabled (get $rag "extraVolumes") }}
      volumes:
        {{- if $persistenceEnabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hugegraph.rag.claimName" . }}
        {{- end }}
        {{- with get $rag "extraVolumes" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
