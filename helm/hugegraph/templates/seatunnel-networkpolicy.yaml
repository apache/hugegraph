{{ include "hugegraph.resolveValues" . }}
{{- if (.Values.seatunnel | default dict).enabled }}
{{- $rules := get .Values.networkPolicy "seatunnel" | default dict }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hugegraph.fullname" . | trunc 53 | trimSuffix "-" }}-seatunnel
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: seatunnel
spec:
  podSelector:
    matchLabels:
      {{- include "hugegraph.netpol.seatunnelLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- if eq .Values.seatunnel.service.type "NodePort" }}
    # Only the authenticated HTTP entry is public; member/CLI traffic stays private.
    - ports:
        {{- include "hugegraph.netpol.ports" (list 8080) | nindent 8 }}
    {{- end }}
    - from:
        {{- include "hugegraph.netpol.seatunnelPeer" . | nindent 8 }}
      ports:
        {{- include "hugegraph.netpol.ports" (list 5801 8080) | nindent 8 }}
    - from:
        {{- if .Values.hubble.enabled }}
        {{- include "hugegraph.netpol.peer" (dict "root" . "component" "hubble") | nindent 8 }}
        {{- end }}
        {{- include "hugegraph.netpol.peer" (dict "root" . "component" "test") | nindent 8 }}
      ports:
        {{- include "hugegraph.netpol.ports" (list 8080) | nindent 8 }}
    {{- with get $rules "extraIngress" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.enabled }}
  egress:
    - to:
        {{- include "hugegraph.netpol.seatunnelPeer" . | nindent 8 }}
      ports:
        {{- include "hugegraph.netpol.ports" (list 5801 8080) | nindent 8 }}
    - to:
        {{- include "hugegraph.netpol.peer" (dict "root" . "component" "server") | nindent 8 }}
      ports:
        {{- include "hugegraph.netpol.ports" (list .Values.server.port) | nindent 8 }}
    {{- include "hugegraph.netpol.dns" . | nindent 4 }}
    {{- with get $rules "extraEgress" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
