{{- $hubble := get .Values "hubble" | default dict }}
{{- if and (get $hubble "enabled" | default false) .Values.hubble.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hugegraph.hubble.dataName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: hubble
  # Survive helm uninstall, matching the PD/Store volumeClaimTemplates
  # behavior; delete the PVC explicitly to discard the stored connection
  # metadata and credentials.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.hubble.persistence.size }}
  {{- if .Values.hubble.persistence.storageClassName }}
  storageClassName: {{ .Values.hubble.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
