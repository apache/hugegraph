{{- $auth := get .Values.server "auth" | default dict -}}
{{- $token := get $auth "token" | default dict -}}
{{- if and (get $auth "enabled" | default false) (not (get $token "existingSecret" | default "")) (or (get $token "value" | default "") (get $token "autoGenerate" | default false)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hugegraph.server.authTokenSecretName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ include "hugegraph.server.authTokenSecretKey" . }}: {{ include "hugegraph.server.authTokenSecretValue" . | quote }}
{{- end }}
