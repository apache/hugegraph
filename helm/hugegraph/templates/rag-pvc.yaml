{{ include "hugegraph.resolveValues" . }}
{{- $rag := get .Values "rag" | default dict }}
{{- $persistence := get $rag "persistence" | default dict }}
{{- $persistenceEnabled := false }}
{{- if get $rag "enabled" | default false }}
{{- $persistenceEnabled = eq (include "hugegraph.rag.persistenceEnabled" .) "true" }}
{{- end }}
{{- if and (get $rag "enabled" | default false) $persistenceEnabled (not (get $persistence "existingClaim" | default "")) }}
{{- include "hugegraph.rag.validate" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hugegraph.rag.dataName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml (get $persistence "accessModes" | default (list "ReadWriteOnce")) | nindent 4 }}
  {{- $storageClass := get $persistence "storageClassName" | default "" }}
  {{- if eq $storageClass "-" }}
  storageClassName: ""
  {{- else if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ get $persistence "size" | default "10Gi" }}
{{- end }}
