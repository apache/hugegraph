{{- define "hugegraph.seatunnel.authSecretName" -}}
{{- printf "%s-auth" (include "hugegraph.seatunnel.name" .) -}}
{{- end -}}

{{/* Resolve a base64 credential and reuse the live Secret during upgrades. */}}
{{- define "hugegraph.seatunnel.authPassword" -}}
{{- $auth := get .Values.seatunnel "auth" | default dict -}}
{{- $password := get $auth "password" | default "" -}}
{{- if $password -}}
{{- $password | b64enc -}}
{{- else -}}
{{- $name := include "hugegraph.seatunnel.authSecretName" . -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $secret (hasKey $secret "data") (hasKey (get $secret "data") "password") -}}
{{- get (get $secret "data") "password" -}}
{{- else -}}
{{- $length := ternary 16 6 (eq (.Values.mode | default "easy") "strict") -}}
{{- include "hugegraph.generatedCredential" (dict "root" . "name" "seatunnel-admin" "length" $length) | b64enc -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{/* Engine YAML uses JVM properties, not Pod env; mount its password in a Secret. */}}
{{- define "hugegraph.seatunnel.engineConfig" -}}
{{- $files := include "hugegraph.seatunnel.config" . | fromYaml -}}
{{- $config := get $files "seatunnel.yaml" | fromYaml | default dict -}}
{{- if hasKey $config "Error" -}}
{{- fail "seatunnel.config[seatunnel.yaml] must contain valid native YAML" -}}
{{- end -}}
{{- $seatunnel := get $config "seatunnel" | default dict -}}
{{- $engine := get $seatunnel "engine" | default dict -}}
{{- $http := get $engine "http" | default dict -}}
{{- $auth := get .Values.seatunnel "auth" | default dict -}}
{{- $_ := set $http "enable-basic-auth" true -}}
{{- $_ := set $http "basic-auth-username" (get $auth "username" | default "admin") -}}
{{- $_ := set $http "basic-auth-password" (include "hugegraph.seatunnel.authPassword" . | b64dec) -}}
{{- $_ := set $engine "http" $http -}}
{{- $_ := set $seatunnel "engine" $engine -}}
{{- $_ := set $config "seatunnel" $seatunnel -}}
{{- $config | toYaml -}}
{{- end -}}

{{- if (.Values.seatunnel | default dict).enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hugegraph.seatunnel.authSecretName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: seatunnel
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ (get (get .Values.seatunnel "auth" | default dict) "username" | default "admin") | b64enc | quote }}
  password: {{ include "hugegraph.seatunnel.authPassword" . | quote }}
  seatunnel.yaml: {{ include "hugegraph.seatunnel.engineConfig" . | b64enc | quote }}
{{- end }}
