{{ include "hugegraph.resolveValues" . }}
{{- $rag := get .Values "rag" | default dict }}
{{- if get $rag "enabled" | default false }}
{{- include "hugegraph.rag.validate" . }}
{{- $service := get $rag "service" | default dict }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugegraph.rag.name" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
  {{- with get $service "annotations" }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ include "hugegraph.rag.serviceType" . }}
  selector:
    {{- include "hugegraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rag
  ports:
    - name: http
      port: {{ include "hugegraph.rag.port" . }}
      targetPort: http
      protocol: TCP
      {{- $nodePort := int (get $service "nodePort" | default 0) }}
      {{- if ne $nodePort 0 }}
      nodePort: {{ $nodePort }}
      {{- end }}
{{- end }}
