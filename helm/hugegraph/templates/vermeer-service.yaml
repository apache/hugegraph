{{ include "hugegraph.resolveValues" . }}
{{- if .Values.vermeer.enabled }}
{{- $v := .Values.vermeer }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugegraph.vermeer.masterName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: vermeer-master
  {{- with $v.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "hugegraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vermeer-master
  ports:
    - name: http
      port: {{ $v.master.httpPort }}
      targetPort: master-http
      {{- with $v.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugegraph.vermeer.masterName" . }}-internal
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: vermeer-master
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "hugegraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vermeer-master
  ports:
    - name: grpc
      port: {{ $v.master.grpcPort }}
      targetPort: master-grpc
{{- if eq $v.mode "cluster" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugegraph.vermeer.workerName" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: vermeer-worker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "hugegraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vermeer-worker
  ports:
    - name: grpc
      port: {{ $v.worker.grpcPort }}
      targetPort: worker-grpc
{{- end }}
{{- end }}
