{{ include "hugegraph.resolveValues" . }}
{{- $rag := get .Values "rag" | default dict }}
{{- $ingress := get $rag "ingress" | default dict }}
{{- if and (get $rag "enabled" | default false) (get $ingress "enabled" | default false) }}
{{- include "hugegraph.rag.validate" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hugegraph.rag.name" . }}
  labels:
    {{- include "hugegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
  {{- with get $ingress "annotations" }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with get $ingress "className" }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with get $ingress "tls" }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range (get $ingress "hosts" | default (list (dict "paths" (list (dict "path" "/" "pathType" "Prefix"))))) }}
    - {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range (.paths | default (list (dict "path" "/" "pathType" "Prefix"))) }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "hugegraph.rag.name" $ }}
                port:
                  number: {{ include "hugegraph.rag.port" $ }}
          {{- end }}
    {{- end }}
{{- end }}
