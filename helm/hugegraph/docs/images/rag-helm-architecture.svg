<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HugeGraph Helm optional RAG integration</title>
  <desc id="desc">One chart manages HugeGraph core services and an optional RAG application for single-node and cluster presets.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.head{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.text{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tag{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#166534}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="64" y="64" class="title">One Helm chart, optional GraphRAG runtime</text>
  <text x="64" y="96" class="subtitle">Default remains unchanged · enable with rag.enabled=true · same template for 1+1+1 and 3+3+3</text>

  <g filter="url(#shadow)">
    <rect x="64" y="140" rx="22" width="1152" height="500" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="92" y="170" rx="18" width="1096" height="438" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="120" y="210" class="head">hugegraph-helm release</text>
  <rect x="1010" y="184" rx="14" width="148" height="34" fill="#dcfce7"/>
  <text x="1084" y="207" text-anchor="middle" class="tag">RAG OFF by default</text>

  <g filter="url(#shadow)">
    <rect x="126" y="252" rx="18" width="230" height="126" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="396" y="252" rx="18" width="230" height="126" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="666" y="252" rx="18" width="230" height="126" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="936" y="252" rx="18" width="210" height="126" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  </g>
  <text x="241" y="296" text-anchor="middle" class="head">PD</text><text x="241" y="329" text-anchor="middle" class="text">1 or 3 replicas</text><text x="241" y="354" text-anchor="middle" class="small">metadata + placement</text>
  <text x="511" y="296" text-anchor="middle" class="head">Store</text><text x="511" y="329" text-anchor="middle" class="text">1 or 3 replicas</text><text x="511" y="354" text-anchor="middle" class="small">HStore data plane</text>
  <text x="781" y="296" text-anchor="middle" class="head">Server Service</text><text x="781" y="329" text-anchor="middle" class="text">topology-neutral DNS</text><text x="781" y="354" text-anchor="middle" class="small">auth Secret reused safely</text>
  <text x="1041" y="296" text-anchor="middle" class="head">RAG</text><text x="1041" y="329" text-anchor="middle" class="text">0..N replicas</text><text x="1041" y="354" text-anchor="middle" class="small">image: hugegraph/rag</text>

  <path d="M356 315 H396" class="line"/><path d="M626 315 H666" class="line"/><path d="M936 315 H896" class="line"/>

  <g filter="url(#shadow)">
    <rect x="190" y="456" rx="16" width="258" height="96" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="512" y="456" rx="16" width="258" height="96" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="834" y="456" rx="16" width="258" height="96" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="319" y="492" text-anchor="middle" class="head">Single preset</text><text x="319" y="523" text-anchor="middle" class="text">1 PD + 1 Store + 1 Server</text>
  <text x="641" y="492" text-anchor="middle" class="head">Cluster preset</text><text x="641" y="523" text-anchor="middle" class="text">3 PD + 3 Store + 3 Server</text>
  <text x="963" y="492" text-anchor="middle" class="head">Flexible boundaries</text><text x="963" y="523" text-anchor="middle" class="text">Service · Ingress · PVC · NetPol</text>

  <path d="M1041 378 V420 H319 V456" class="line"/><path d="M1041 378 V420 H641 V456" class="line"/><path d="M1041 378 V456" class="line"/>
  <text x="640" y="594" text-anchor="middle" class="small">Docker and docker-compose in hugegraph-ai remain unchanged; Kubernetes ownership moves to the main chart.</text>
</svg>
